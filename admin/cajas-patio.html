<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cajas en patio · MEJAnet v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Colores del logo grupomeja: azul marino #091932 y azul cielo #4EC9EE */
  :root{--marino:#091932;--marino-2:#16294a;--cielo:#4ec9ee;--cielo-osc:#1aa6d1;--cielo-claro:#e6f7fd;--bg:#f3f6fa;--ink:#091932;--muted:#5d6878;--line:#cfd9e4;--err:#c0262d;--err-bg:#fff4f4;--ok:#1e7a4c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1500px;margin:0 auto;padding:18px max(16px,2vw) 48px}

  header{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 16px;align-items:center;margin-bottom:18px}
  header .logo{justify-self:start;display:block;width:170px;height:46px;background:url(/logo-color.png) left center/contain no-repeat}
  header .tit{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  h1.titulo{display:inline-flex;align-items:center;gap:12px;margin:0;padding:6px 22px 6px 6px;border-radius:14px;background:var(--marino);color:#fff;
    box-shadow:0 3px 0 #000c1f,0 8px 20px rgba(9,25,50,.22);font-family:"Oswald","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:27px;letter-spacing:1.2px;line-height:1.1;white-space:nowrap;text-transform:uppercase}
  h1.titulo .ico{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--cielo);border-radius:10px;color:var(--marino)}
  h1.titulo .ico svg{width:34px;height:34px}
  header small{color:var(--muted)}
  a.volver{justify-self:end;display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);text-decoration:none;font-weight:700;font-size:13px}
  a.volver:hover{color:var(--ink);border-color:var(--ink)}
  a.volver svg{width:16px;height:16px}
  @media (max-width:760px){header{grid-template-columns:1fr;justify-items:center}header .logo,a.volver{justify-self:center}h1.titulo{font-size:22px}}

  /* Indicadores */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--cielo);cursor:pointer;text-align:left}
  .kpi:hover{border-color:var(--cielo-osc)}
  .kpi.on{background:var(--cielo-claro);border-color:var(--cielo-osc)}
  .kpi.marino{border-top-color:var(--marino)}
  .kpi b{display:block;font:600 32px/1.05 "Oswald","Arial Narrow",sans-serif;color:var(--marino)}
  .kpi span{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

  /* Barra */
  .barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .barra input[type=search]{flex:1 1 260px;min-width:0;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .barra select{padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;max-width:220px}
  .barra input:focus,.barra select:focus{outline:none;border-color:var(--cielo-osc);box-shadow:0 0 0 3px rgba(78,201,238,.25)}
  .seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--marino);color:#fff}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:0;border-radius:10px;font:600 15px "Oswald","Arial Narrow",sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn svg{width:18px;height:18px}
  .btn.prim{background:var(--cielo);color:var(--marino);box-shadow:0 3px 0 var(--cielo-osc)}
  .btn.prim:hover{filter:brightness(1.05)}
  .btn.prim:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cielo-osc)}
  .btn.osc{background:var(--marino);color:#fff;box-shadow:0 3px 0 #000c1f}
  .btn.sec{background:#fff;color:var(--marino);border:1.5px solid var(--line)}
  .btn.sec:hover{border-color:var(--marino)}
  .btn:disabled{opacity:.55;cursor:default}
  .cuenta{color:var(--muted);font-size:13px;margin:-4px 0 12px}

  /* Tarjetas de cajas */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(9,25,50,.05)}
  .card.salio{opacity:.72}
  .card .fotos{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0f2342,#1c3560);display:flex;align-items:center;justify-content:center;color:#7f93b3;cursor:zoom-in}
  .card .fotos img.principal{width:100%;height:100%;object-fit:cover;display:block}
  .card .fotos .sin{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;cursor:default}
  .card .fotos .sin svg{width:44px;height:44px;opacity:.7}
  .card .fotos img.placa{position:absolute;right:10px;bottom:10px;width:34%;aspect-ratio:2/1;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);background:#fff}
  .card .fotos .estado{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .chip.cargada{background:var(--marino);color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
  .chip.vacia{background:#fff;color:var(--marino);box-shadow:inset 0 0 0 2px var(--cielo)}
  .chip.ubi{background:var(--cielo);color:var(--marino)}
  .chip.salida{background:#6b7480;color:#fff}
  .card .cuerpo{padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .card .num{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em;color:var(--marino)}
  .card .num small{display:block;font:600 12px "IBM Plex Sans",sans-serif;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
  .card .linea{text-align:right;font-weight:700;font-size:13px;line-height:1.25}
  .card .linea span{display:block;color:var(--cielo-osc);font-size:12px;letter-spacing:.06em}
  .card dl{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.2fr);gap:6px 10px;margin:0;padding:10px 0 2px;border-top:1px dashed var(--line)}
  .card dt{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .card dl .ancho{grid-column:1/-1}
  .card dd{margin:1px 0 0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .placa-txt{font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.06em}
  .card .llegada{font-size:12.5px;color:var(--muted)}
  .card .llegada b{color:var(--ink)}
  .card .notas{font-size:12.5px;color:var(--muted);font-style:italic}
  .card .acc{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid #edf1f6;background:#fafcfe}
  .card .acc button{flex:1;padding:8px 6px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:var(--marino)}
  .card .acc button:hover{border-color:var(--marino)}
  .card .acc button.sal{background:var(--marino);border-color:var(--marino);color:#fff}
  .card .acc button.sal:hover{background:var(--marino-2)}
  .card .acc button.mas{flex:0 0 40px}
  .vacio{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);background:#fff;border:1.5px dashed var(--line);border-radius:14px}
  .vacio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  /* Ventana de registro */
  .modal[hidden]{display:none}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;background:rgba(9,25,50,.55);overflow:auto}
  .modal .caja{width:min(820px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(9,25,50,.4);overflow:hidden}
  .modal .cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--marino);color:#fff}
  .modal .cab h2{margin:0;font:600 21px "Oswald","Arial Narrow",sans-serif;letter-spacing:1px;text-transform:uppercase}
  .modal .cab button{border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:8px;font-size:20px;cursor:pointer}
  .modal .cont{padding:18px}
  .fotosForm{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  @media (max-width:560px){.fotosForm{gap:10px}.slot{aspect-ratio:1/1;padding:8px}.slot .ayuda{display:none}.slot b{font-size:13.5px}.modal{padding:0}.modal .caja{border-radius:0;min-height:100%}}
  .slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;border:2px dashed #9fd9ee;border-radius:14px;background:var(--cielo-claro);color:var(--marino);cursor:pointer;text-align:center;padding:12px;overflow:hidden}
  .slot:hover{border-color:var(--cielo-osc)}
  .slot svg{width:42px;height:42px;color:var(--cielo-osc)}
  .slot b{font-size:15px}
  .slot span{font-size:12.5px;color:var(--muted)}
  .slot input{display:none}
  .slot.con{border-style:solid;border-color:var(--marino);padding:0;background:#000}
  .slot.con img{width:100%;height:100%;object-fit:contain}
  .slot.con > svg,.slot.con > b,.slot.con > span.ayuda{display:none}
  .slot .quitar{position:absolute;top:8px;right:8px;border:0;background:rgba(9,25,50,.75);color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;display:none}
  .slot.con .quitar{display:block}
  .slot .leyendo{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(9,25,50,.85);color:#fff;font-size:12.5px;font-weight:600;display:none;align-items:center;gap:8px}
  .slot .leyendo.ver{display:flex}
  .slot .leyendo i{width:14px;height:14px;border:2px solid var(--cielo);border-right-color:transparent;border-radius:50%;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .campos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
  .campo{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0}
  .campo.w3{grid-column:span 3}.campo.w6{grid-column:span 6}
  @media (max-width:560px){.campo,.campo.w3{grid-column:span 6}}
  .campo label,.campo .lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-transform:uppercase}
  .campo textarea{text-transform:none;resize:vertical;min-height:44px}
  .campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--cielo-osc);box-shadow:0 0 0 3px rgba(78,201,238,.25)}
  .campo input.grande{font:700 22px "Barlow Condensed",sans-serif;letter-spacing:.05em;padding:6px 12px}
  .campo input.leido{border-color:var(--cielo-osc);background:var(--cielo-claro)}
  .campo .pista{font-size:12px;color:var(--cielo-osc);font-weight:600;min-height:0}
  .campo .pista:empty{display:none}
  .opciones{display:flex;gap:6px;flex-wrap:wrap}
  .opciones button{flex:1;min-width:58px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:700;cursor:pointer;color:var(--marino)}
  .opciones button:hover{border-color:var(--marino)}
  .opciones button.on{background:var(--marino);border-color:var(--marino);color:#fff}
  .opciones.cielo button.on{background:var(--cielo);border-color:var(--cielo-osc);color:var(--marino)}
  .fecha{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#f3f6fa;border:1px solid var(--line);font-weight:600}
  .fecha svg{width:20px;height:20px;color:var(--cielo-osc);flex:0 0 auto}
  .fecha small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  /* Sugerencias de Línea / Cliente: la primera queda marcada y ENTER la escribe */
  .sug{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:3px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(9,25,50,.16);padding:4px;max-height:240px;overflow:auto}
  .sug[hidden]{display:none}
  .sug div{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sug div.act{background:var(--marino);color:#fff}
  .sug div:not(.act):hover{background:var(--cielo-claro)}
  .sug b{font-weight:800}
  .campo .conSug{position:relative}
  .otra{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-top:6px}
  .otra[hidden]{display:none}
  .pie{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid #e8edf3;background:#fafcfe;flex-wrap:wrap}
  .pie .msg{flex:1;min-width:180px;font-size:13px;color:var(--err)}

  /* Foto en grande */
  .visor[hidden]{display:none}
  .visor{position:fixed;inset:0;z-index:70;background:rgba(5,12,25,.92);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .visor img{max-width:100%;max-height:100%;border-radius:8px}
  .visor .pies{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .visor .pies button{border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.15);color:#fff;font-weight:600;cursor:pointer}
  .visor .pies button.on{background:var(--cielo);color:var(--marino)}

  .menu{position:fixed;z-index:55;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(9,25,50,.2);padding:6px;min-width:190px}
  .menu[hidden]{display:none}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px}
  .menu button:hover{background:var(--cielo-claro)}
  .menu button.rojo{color:var(--err)}
  .menu button.rojo:hover{background:var(--err-bg)}
  .aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--marino);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .aviso[hidden]{display:none}
  .aviso.err{background:var(--err)}
  .sl-oculto{display:none!important}
  @media (max-width:520px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.kpi{padding:8px 2px;border-top-width:3px;text-align:center}.kpi b{font-size:22px}.kpi span{font-size:8.6px;letter-spacing:0;line-height:1.15;display:block;overflow-wrap:anywhere}
    #nueva{flex:1 1 100%}.barra select{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/modulos" aria-label="MEJAnet · grupomeja"></a>
    <div class="tit">
      <h1 class="titulo"><span class="ico" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="16" width="40" height="28" rx="2.5" fill="currentColor" fill-opacity=".14"/><path d="M14 16v28M24 16v28M34 16v28"/><path d="M44 26h8l7 9v9H44z" fill="currentColor" fill-opacity=".14"/><circle cx="15" cy="49" r="4.5" fill="#fff"/><circle cx="50" cy="49" r="4.5" fill="#fff"/></svg>
      </span>Cajas en patio</h1>
      <small>Registra cada caja con su foto y la de su placa: el número y la placa se leen de las fotos.</small>
    </div>
    <a class="volver" href="/herramientas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> Herramientas</a>
  </header>

  <div class="kpis" id="kpis">
    <button class="kpi" data-f="VACIA" type="button"><b id="kVacias">0</b><span>Vacías</span></button>
    <button class="kpi" data-f="CARGADA" type="button"><b id="kCargadas">0</b><span>Cargadas</span></button>
    <button class="kpi" data-f="ANDEN" type="button"><b id="kAnden">0</b><span>En andén</span></button>
    <button class="kpi marino" data-f="PATIO" type="button"><b id="kPatio">0</b><span>En patio</span></button>
    <button class="kpi" data-f="salieron" type="button"><b id="kSalieron">0</b><span>Salieron hoy</span></button>
  </div>

  <div class="barra">
    <button class="btn prim sl-cambia" id="nueva" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Registrar caja</button>
    <input id="buscar" type="search" placeholder="Buscar caja, placa, línea, cliente o referencia MEJA…" aria-label="Buscar">
    <select id="fLinea" aria-label="Filtrar por línea"><option value="">Todas las líneas</option></select>
    <div class="seg" id="fVista" role="group" aria-label="Qué cajas ver">
      <button type="button" data-v="patio" class="on">Sin salida</button>
      <button type="button" data-v="salieron">Salieron</button>
      <button type="button" data-v="todas">Todas</button>
    </div>
    <button class="btn sec" id="pdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg> PDF</button>
    <button class="btn sec" id="xlsx" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg> XLSX</button>
  </div>
  <div class="cuenta" id="cuenta"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- Registrar / editar caja -->
<div class="modal" id="dlg" hidden>
  <form class="caja" id="form" autocomplete="off" novalidate>
    <div class="cab"><h2 id="dlgTit">Registrar caja</h2><button type="button" id="cerrar" aria-label="Cerrar">×</button></div>
    <div class="cont">
      <div class="fotosForm">
        <label class="slot" id="slotCaja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
          <b>Foto de la caja</b>
          <span class="ayuda">Que se vea bien el número de la caja</span>
          <img alt="Foto de la caja" hidden>
          <button type="button" class="quitar">Cambiar foto</button>
          <div class="leyendo"><i></i><span>Leyendo el número de caja…</span></div>
          <input type="file" accept="image/*" capture="environment" id="fotoCaja">
        </label>
        <label class="slot" id="slotPlaca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="11" rx="2"/><path d="M7 10.5h4M7 13.5h10"/><circle cx="16.5" cy="10.5" r=".8" fill="currentColor"/></svg>
          <b>Foto de la placa</b>
          <span class="ayuda">De frente y lo más cerca posible</span>
          <img alt="Foto de la placa" hidden>
          <button type="button" class="quitar">Cambiar foto</button>
          <div class="leyendo"><i></i><span>Leyendo la placa… (unos segundos)</span></div>
          <input type="file" accept="image/*" capture="environment" id="fotoPlaca">
        </label>
      </div>

      <div class="campos">

        <div class="campo"><span class="lbl">Medida</span><div class="opciones" data-campo="medida"><button type="button" data-v="53">53'</button><button type="button" data-v="48">48'</button><button type="button" data-v="40">40'</button></div></div>
        <div class="campo"><label for="meja">MEJA (referencia)</label><input id="meja" placeholder="Ej. 1836/26"></div>
        <div class="campo w3"><span class="lbl">Estatus</span><div class="opciones" data-campo="estatus"><button type="button" data-v="CARGADA">Cargada</button><button type="button" data-v="VACIA">Vacía</button></div></div>
        <div class="campo w3"><span class="lbl">Ubicación</span><div class="opciones cielo" data-campo="ubicacion"><button type="button" data-v="PATIO">Patio</button><button type="button" data-v="ANDEN">Andén</button></div></div>
        <div class="campo w6">
          <span class="lbl">Llegada</span>
          <div class="fecha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><div><span id="fechaTxt"></span><small id="fechaNota">Se registra sola con la fecha y hora en que guardas.</small></div></div>

<div class="visor" id="visor" hidden><img alt="Foto"><div class="pies"><button type="button" data-t="caja">Caja</button><button type="button" data-t="placa">Placa</button></div></div>

  <button type="button" data-a="editar">Editar datos y fotos</button>
  <button type="button" data-a="regresar">Regresar al patio</button>
  <button type="button" data-a="borrar" class="rojo">Borrar registro</button>
</div>
<div class="aviso" id="aviso" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
let cajas = [], lineas = [], clientes = [], vista = 'patio', filtroKpi = '';
const soloLectura = () => !!window.MEJA_SOLO_LECTURA;

// --- Fechas ---
const fFecha = d => new Date(d).toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fFechaHora = d => new Date(d).toLocaleString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
// Días en patio, contando por fecha (sin horas)
function hace(d) {
  const dia = x => { const f = new Date(x); return Date.UTC(f.getFullYear(), f.getMonth(), f.getDate()); };
  const dias = Math.round((dia(Date.now()) - dia(d)) / 86400000);
  return dias <= 0 ? 'hoy' : dias === 1 ? 'hace 1 día' : `hace ${dias} días`;
}
const esHoy = d => d && new Date(d).toDateString() === new Date().toDateString();

function aviso(t, err) {
  const a = $('aviso'); a.textContent = t; a.className = 'aviso' + (err ? ' err' : ''); a.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(() => { a.hidden = true; }, err ? 5000 : 2600);
}

// --- Cargar y mostrar ---
async function cargar() {
  try {
    const r = await fetch('/api/cajas');
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'el servidor respondió ' + r.status);
    cajas = j.cajas || []; lineas = j.lineas || []; clientes = j.clientes || [];
    llenarLineas(); pintar();
  } catch (e) {
    $('grid').innerHTML = `<div class="vacio"><b>No se pudo cargar la lista</b>${esc(e.message)}</div>`;
  }
}
function llenarLineas() {
  const usadas = [...new Set(cajas.map(c => c.datos.linea).filter(Boolean))].sort();
  const v = $('fLinea').value;
  $('fLinea').innerHTML = '<option value="">Todas las líneas</option>' + usadas.map(l => `<option>${esc(l)}</option>`).join('');
  $('fLinea').value = usadas.includes(v) ? v : '';
  // Sugerencias: las líneas que ya se han capturado
  sugLinea.valores = [...new Set([...lineas, ...usadas])].sort();
  sugCliente.valores = [...new Set([...clientes, ...cajas.map(c => c.datos.cliente).filter(Boolean)])].sort();
}
const fotoUrl = (c, t) => `/api/cajas/${c.id}/foto/${t}?v=${encodeURIComponent(c.actualizado || '')}`;
const ICO_CAJA = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><rect x="4" y="16" width="40" height="28" rx="2.5"/><path d="M14 16v28M24 16v28M34 16v28"/><path d="M44 26h8l7 9v9H44z"/><circle cx="15" cy="49" r="4.5"/><circle cx="50" cy="49" r="4.5"/></svg>';
function pintar() {
  const enPatio = cajas.filter(c => !c.salida);
  // EN PATIO y EN ANDÉN son ubicaciones (de las cajas que no han salido)
  $('kPatio').textContent = enPatio.filter(c => c.datos.ubicacion === 'PATIO').length;
  $('kCargadas').textContent = enPatio.filter(c => c.datos.estatus === 'CARGADA').length;
  $('kVacias').textContent = enPatio.filter(c => c.datos.estatus === 'VACIA').length;
  $('kAnden').textContent = enPatio.filter(c => c.datos.ubicacion === 'ANDEN').length;
  $('kSalieron').textContent = cajas.filter(c => esHoy(c.salida)).length;
  document.querySelectorAll('.kpi').forEach(k => k.classList.toggle('on', k.dataset.f === filtroKpi));
  document.querySelectorAll('#fVista button').forEach(b => b.classList.toggle('on', b.dataset.v === vista));

  const q = norm($('buscar').value), fl = $('fLinea').value;
  const lista = filtradas();
  $('cuenta').textContent = (q || fl || filtroKpi) ? `Mostrando ${lista.length} de ${vista === 'patio' ? enPatio.length : cajas.length} cajas` : '';
  if (!lista.length) {
    $('grid').innerHTML = `<div class="vacio"><b>${cajas.length ? 'Ninguna caja coincide' : 'Todavía no hay cajas registradas'}</b>${cajas.length ? 'Prueba con otra búsqueda o filtro.' : 'Usa <i>Registrar caja</i> para dar de alta la primera.'}</div>`;
    return;
  }
  $('grid').innerHTML = lista.map(c => {
    const d = c.datos, fotos = c.fotos || [];
    const principal = fotos.includes('caja') ? 'caja' : fotos.includes('placa') ? 'placa' : '';
    const estado = (d.estatus ? `<span class="chip ${d.estatus === 'CARGADA' ? 'cargada' : 'vacia'}">${d.estatus === 'CARGADA' ? 'Cargada' : 'Vacía'}</span>` : '') +
      (d.ubicacion ? `<span class="chip ubi">${d.ubicacion === 'ANDEN' ? 'Andén' : 'Patio'}</span>` : '') + (c.salida ? '<span class="chip salida">Salió</span>' : '');
    return `<article class="card${c.salida ? ' salio' : ''}" data-id="${c.id}">
      <div class="fotos" data-ver="${principal}">
        ${principal ? `<img class="principal" src="${fotoUrl(c, principal)}" alt="Foto de la caja ${esc(d.caja)}" loading="lazy">` : `<div class="sin">${ICO_CAJA}Sin foto</div>`}
        ${principal === 'caja' && fotos.includes('placa') ? `<img class="placa" src="${fotoUrl(c, 'placa')}" alt="Foto de la placa" loading="lazy" data-ver="placa">` : ''}
        <div class="estado">${estado}</div>
      </div>
      <div class="cuerpo">
        <div class="top">
          <div class="num"><small>Caja</small>${esc(d.caja)}</div>
          <div class="linea">${esc(d.linea || 'Sin línea')}</div>
        </div>
        <dl>
          <div><dt>Placa</dt><dd class="placa-txt">${esc(d.placa || '—')}</dd></div>
          <div><dt>Origen</dt><dd>${esc(d.origen || '—')}</dd></div>
          <div><dt>Medida</dt><dd>${d.medida ? esc(d.medida) + "'" : '—'}</dd></div>
          <div><dt>MEJA</dt><dd>${esc(d.meja || '—')}</dd></div>
          <div class="ancho"><dt>Cliente</dt><dd>${esc(d.cliente || '—')}</dd></div>
        </dl>
        <div class="llegada">Llegó <b title="${fFechaHora(c.llegada)}">${fFecha(c.llegada)}</b> · ${hace(c.llegada)}${c.creado_por ? ' · ' + esc(c.creado_por) : ''}${c.salida ? `<br>Salió <b title="${fFechaHora(c.salida)}">${fFecha(c.salida)}</b>` : ''}</div>
      </div>
      <div class="acc sl-cambia">
        ${c.salida ? '' : '<button type="button" class="sal" data-a="salida">Dar salida</button>'}
        <button type="button" data-a="editar">Editar</button>
        <button type="button" class="mas" data-a="menu" aria-label="Más opciones">⋯</button>
      </div>
    </article>`;
  }).join('');
  if (soloLectura()) document.querySelectorAll('.sl-cambia').forEach(x => x.classList.add('sl-oculto'));
}
function filtradas() {
  const q = norm($('buscar').value), fl = $('fLinea').value;
  return cajas.filter(c => {
    if (filtroKpi === 'salieron') { if (!esHoy(c.salida)) return false; }
    else {
      if (vista === 'patio' && c.salida) return false;
      if (vista === 'salieron' && !c.salida) return false;
    }
    const d = c.datos;
    if (filtroKpi === 'CARGADA' || filtroKpi === 'VACIA') { if (d.estatus !== filtroKpi) return false; }
    if ((filtroKpi === 'ANDEN' || filtroKpi === 'PATIO') && d.ubicacion !== filtroKpi) return false;
    if (fl && d.linea !== fl) return false;
    return !q || [d.caja, d.placa, d.linea, d.meja, d.cliente].some(x => norm(x).includes(q));
  });
}

// --- Filtros ---
$('buscar').addEventListener('input', () => { clearTimeout(pintar.t); pintar.t = setTimeout(pintar, 120); });
$('fLinea').addEventListener('change', pintar);
$('fVista').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; vista = b.dataset.v; filtroKpi = ''; pintar(); });
$('kpis').addEventListener('click', ev => {
  const k = ev.target.closest('.kpi'); if (!k) return;
  const f = k.dataset.f;
  filtroKpi = filtroKpi === f ? '' : f;
  if (f !== 'salieron') vista = 'patio';
  pintar();
});

// --- Ventana de registro ---
let editando = null; // caja que se edita (null = nueva)
let fotos = { caja: undefined, placa: undefined }; // data URL nueva, null = quitar, undefined = sin cambio
const sel = { origen: '', medida: '', estatus: '', ubicacion: '' };
function elegir(campo, v) {
  sel[campo] = v;
  document.querySelectorAll(`.opciones[data-campo="${campo}"] button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
document.querySelectorAll('.opciones').forEach(o => o.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const c = o.dataset.campo; elegir(c, sel[c] === b.dataset.v ? '' : b.dataset.v);
}));
function abrir(c) {
  editando = c || null;
  fotos = { caja: undefined, placa: undefined };
  $('form').reset();
  const d = c?.datos || {};
  $('dlgTit').textContent = c ? 'Editar caja ' + d.caja : 'Registrar caja';
  $('caja').value = d.caja || ''; $('placa').value = d.placa || ''; $('meja').value = d.meja || ''; $('cliente').value = d.cliente || '';
  $('linea').value = d.linea || '';
  for (const k of Object.keys(sel)) elegir(k, d[k] || (c ? '' : { origen: '', medida: '53', estatus: '', ubicacion: 'PATIO' }[k]));
  for (const t of ['caja', 'placa']) mostrarFoto(t, c && (c.fotos || []).includes(t) ? fotoUrl(c, t) : '');
  ['pCaja', 'pPlaca'].forEach(id => { $(id).textContent = ''; });
  ['caja', 'placa'].forEach(id => $(id).classList.remove('leido'));
  $('fechaTxt').textContent = c ? fFecha(c.llegada) : 'Hoy, ' + fFecha(new Date());
  $('fechaNota').textContent = c ? 'Fecha en que se registró (no cambia).' : 'Se registra sola con la fecha y hora en que guardas.';
  $('dlgMsg').textContent = '';
  $('dlg').hidden = false;
  document.body.style.overflow = 'hidden';
  clearInterval(abrir.reloj);
  if (!c) abrir.reloj = setInterval(() => { $('fechaTxt').textContent = 'Hoy, ' + fFecha(new Date()); }, 20000);
}
function cerrar() { $('dlg').hidden = true; document.body.style.overflow = ''; clearInterval(abrir.reloj); }
$('nueva').addEventListener('click', () => abrir());
$('cerrar').addEventListener('click', cerrar);
$('cancelar').addEventListener('click', cerrar);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (!$('visor').hidden) $('visor').hidden = true; else if (!$('dlg').hidden) cerrar(); $('menu').hidden = true; } });

function mostrarFoto(t, src) {
  const slot = $(t === 'caja' ? 'slotCaja' : 'slotPlaca'), img = slot.querySelector('img');
  slot.classList.toggle('con', !!src); img.hidden = !src;
  if (src) img.src = src; else img.removeAttribute('src');
}
// Reduce la foto (máx. 1280 px, JPEG) para que suba rápido desde el celular
function reducir(file, max = 1280) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      ok({ data: cv.toDataURL('image/jpeg', 0.82), canvas: cv });
    };
    im.onerror = () => { URL.revokeObjectURL(url); ko(new Error('No pude abrir la foto.')); };
    im.src = url;
  });
}
for (const t of ['caja', 'placa']) {
  const slot = $(t === 'caja' ? 'slotCaja' : 'slotPlaca'), input = $(t === 'caja' ? 'fotoCaja' : 'fotoPlaca');
  slot.querySelector('.quitar').addEventListener('click', ev => { ev.preventDefault(); input.click(); });
  input.addEventListener('change', async () => {
    const f = input.files[0]; input.value = '';
    if (!f) return;
    try {
      const { data, canvas } = await reducir(f);
      fotos[t] = data; mostrarFoto(t, data);
      leerFoto(t, canvas);
    } catch (e) { $('dlgMsg').textContent = e.message; }
  });
}

// --- Lectura de las fotos (OCR en el navegador con Tesseract) ---
let tesseract;
function cargarTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return tesseract ||= new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = ok; s.onerror = () => { tesseract = null; ko(new Error('no se pudo cargar el lector de texto')); };
    document.head.appendChild(s);
  });
}
let worker;
async function obtenerWorker() {
  await cargarTesseract();
  // Modo "texto disperso": en una foto los letreros están sueltos, no en párrafos
  return worker ||= Tesseract.createWorker('eng', 1, { logger: () => {} }).then(async w => { await w.setParameters({ tessedit_pageseg_mode: '11' }); return w; });
}
// Imagen en escala de grises con más contraste: el OCR lee mejor números pintados en la caja
function preparar(canvas) {
  const k = Math.min(1, 1600 / Math.max(canvas.width, canvas.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(canvas.width * k); cv.height = Math.round(canvas.height * k);
  const g = cv.getContext('2d'); g.drawImage(canvas, 0, 0, cv.width, cv.height);
  const im = g.getImageData(0, 0, cv.width, cv.height), p = im.data;
  for (let i = 0; i < p.length; i += 4) {
    let y = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
    y = Math.max(0, Math.min(255, (y - 128) * 1.6 + 128));
    p[i] = p[i + 1] = p[i + 2] = y;
  }
  g.putImageData(im, 0, 0);
  return cv;
}
// Palabras leídas con su tamaño (las letras más grandes suelen ser el número de caja o la placa)
async function palabras(canvas) {
  const w = await obtenerWorker();
  await w.setParameters({ tessedit_pageseg_mode: '11' });
  const { data } = await w.recognize(preparar(canvas));
  return (data.words || []).map(x => ({ t: x.text.toUpperCase().replace(/[^A-Z0-9]/g, ''), h: x.bbox.y1 - x.bbox.y0, conf: x.confidence })).filter(x => x.t.length >= 2 && x.conf > 30);
}
// --- Lectura de la placa ---
// Las placas mexicanas traen guiones (66-US-6X) y letras delgadas; el OCR las lee mejor
// recortando la franja de los caracteres grandes, en blanco y negro y a un tamaño medio.
function recorte(src, x, y, w, h, esc, bn) {
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * esc)); cv.height = Math.max(1, Math.round(h * esc));
  const g = cv.getContext('2d'); g.drawImage(src, x, y, w, h, 0, 0, cv.width, cv.height);
  const im = g.getImageData(0, 0, cv.width, cv.height), d = im.data, Y = new Uint8Array(d.length / 4), hist = new Array(256).fill(0);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) { Y[j] = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]); hist[Y[j]]++; }
  let th = 128;
  if (bn) { // umbral de Otsu
    let tot = Y.length, sum = 0, sB = 0, wB = 0, best = 0;
    for (let t = 0; t < 256; t++) sum += t * hist[t];
    for (let t = 0; t < 256; t++) { wB += hist[t]; if (!wB) continue; const wF = tot - wB; if (!wF) break; sB += t * hist[t]; const v = wB * wF * (sB / wB - (sum - sB) / wF) ** 2; if (v > best) { best = v; th = t; } }
  }
  for (let i = 0, j = 0; i < d.length; i += 4, j++) d[i] = d[i + 1] = d[i + 2] = bn ? (Y[j] > th ? 255 : 0) : Y[j];
  g.putImageData(im, 0, 0);
  return cv;
}
// Placas posibles dentro de un texto leído
function placasEn(texto) {
  const t = ' ' + String(texto).toUpperCase().replace(/\s*[-–—]\s*/g, '-').replace(/[^A-Z0-9\-]+/g, ' ') + ' ';
  const out = [];
  for (const m of t.matchAll(/([A-Z0-9]{1,4})-([A-Z0-9]{1,4})(?:-([A-Z0-9]{1,4}))?/g)) {
    let g = [m[1], m[2], m[3]].filter(Boolean);
    // El borde de la placa a veces se lee como "1" o "I" pegado al primer grupo (166-US-6X)
    if (g.length === 3 && g[0].length === 3 && g[1].length === 2 && g[2].length === 2 && /^[1IL]/.test(g[0])) g[0] = g[0].slice(1);
    if (g.length === 3 && g[2].length === 3 && g[0].length === 2 && g[1].length === 2 && /[1IL]$/.test(g[2])) g[2] = g[2].slice(0, -1);
    const p = g.join('');
    if (p.length >= 5 && p.length <= 8 && /\d/.test(p) && /[A-Z]/.test(p)) out.push(p);
  }
  for (const w of t.split(/[\s\-]+/)) if (w.length >= 5 && w.length <= 8 && /\d/.test(w) && /[A-Z]/.test(w)) out.push(w);
  return out;
}
async function leerPlaca(canvas) {
  const w = await obtenerWorker();
  const votos = new Map(), votar = (txt, peso) => { for (const p of placasEn(txt)) votos.set(p, (votos.get(p) || 0) + peso); };
  const W = canvas.width, H = canvas.height;
  // 1) Foto completa: ubica los caracteres más grandes (normalmente la placa)
  await w.setParameters({ tessedit_pageseg_mode: '11' });
  const { data } = await w.recognize(recorte(canvas, 0, 0, W, H, 1, false));
  votar(data.words.filter(x => x.confidence > 30).map(x => x.text).join(' '), 1);
  const altos = data.words.filter(x => /[A-Z0-9]/i.test(x.text) && (x.bbox.y1 - x.bbox.y0) > H * 0.05)
    .sort((a, b) => (b.bbox.y1 - b.bbox.y0) - (a.bbox.y1 - a.bbox.y0)).slice(0, 2);
  // Si no encontró nada grande, prueba franjas a lo alto de la foto
  const franjas = altos.length ? altos.map(x => { const h = x.bbox.y1 - x.bbox.y0; return { y: x.bbox.y0 - h * 0.35, h: h * 1.7, alto: h }; })
    : [0.25, 0.4, 0.55].map(c => ({ y: H * c - H * 0.12, h: H * 0.24, alto: H * 0.15 }));
  // 2) Cada franja en blanco y negro, leída como una línea de texto
  for (const f of franjas) {
    const y = Math.max(0, f.y), h = Math.min(H - y, f.h), esc = Math.min(1, 60 / f.alto);
    for (const [bn, psm] of [[true, '13'], [true, '11'], [false, '11']]) {
      await w.setParameters({ tessedit_pageseg_mode: psm });
      const r = await w.recognize(recorte(canvas, 0, y, W, h, esc, bn));
      votar(r.data.text, bn ? 2 : 1);
    }
    if ([...votos.values()].some(v => v >= 3)) break; // ya hay una placa clara
  }
  await w.setParameters({ tessedit_pageseg_mode: '11' });
  return [...votos.entries()].sort((a, b) => b[1] - a[1] || b[0].length - a[0].length)[0]?.[0] || '';
}
const comoNumero = s => s.replace(/O/g, '0').replace(/[IL]/g, '1').replace(/S/g, '5').replace(/B/g, '8').replace(/Z/g, '2');

async function leerFoto(t, canvas) {
  const slot = $(t === 'caja' ? 'slotCaja' : 'slotPlaca'), lee = slot.querySelector('.leyendo');

      const nums = ws.map(x => ({ ...x, n: comoNumero(x.t.replace(/^[A-Z]{4}/, '')) })).filter(x => /^\d{3,7}$/.test(x.n)).sort((a, b) => b.h - a.h);
      if (nums[0] && !$('caja').value.trim()) { $('caja').value = nums[0].n; $('caja').classList.add('leido'); $('pCaja').textContent = 'Leído de la foto: revisa que esté bien.'; }

    } else {
      const placa = await enCola(() => leerPlaca(canvas));
      if (placa && !$('placa').value.trim()) { $('placa').value = placa; $('placa').classList.add('leido'); $('pPlaca').textContent = 'Leída de la foto: revisa que esté bien.'; }

    }
  } catch (e) {
    $(t === 'caja' ? 'pCaja' : 'pPlaca').textContent = 'No pude leer la foto (' + e.message + '): escribe el dato.';
  } finally { lee.classList.remove('ver'); }
}

// --- Sugerencias de Línea y Cliente (lo ya capturado): la primera queda marcada;
// flechas para moverse, ENTER o clic la escribe completa, ESC cierra ---
function sugerencias(input) {
  const caja = document.createElement('div'); caja.className = 'sug'; caja.hidden = true;
  input.parentElement.appendChild(caja);
  const ctl = { valores: [] };
  let items = [], act = 0;
  const pinta = () => {
    caja.innerHTML = items.map((v, i) => {
      const q = input.value.trim(), k = v.toUpperCase().indexOf(q.toUpperCase());
      const t = k >= 0 && q ? esc(v.slice(0, k)) + '<b>' + esc(v.slice(k, k + q.length)) + '</b>' + esc(v.slice(k + q.length)) : esc(v);
      return `<div data-i="${i}" class="${i === act ? 'act' : ''}">${t}</div>`;
    }).join('');
    caja.hidden = !items.length;
    const a = caja.children[act]; if (a) a.scrollIntoView({ block: 'nearest' });
  };
  const busca = () => {
    const q = norm(input.value);
    if (!q) { items = []; return pinta(); }
    const empieza = ctl.valores.filter(v => norm(v).startsWith(q));
    const contiene = ctl.valores.filter(v => !norm(v).startsWith(q) && norm(v).includes(q));
    items = [...empieza, ...contiene].filter(v => norm(v) !== q).slice(0, 8); act = 0; pinta();
  };
  const elige = i => { if (items[i] == null) return; input.value = items[i]; items = []; pinta(); };
  input.addEventListener('input', busca);
  input.addEventListener('focus', () => { if (input.value.trim()) busca(); });
  input.addEventListener('blur', () => setTimeout(() => { items = []; pinta(); }, 120));
  input.addEventListener('keydown', e => {
    if (caja.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); act = (act + 1) % items.length; pinta(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); act = (act - 1 + items.length) % items.length; pinta(); }
    else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); elige(act); }
    else if (e.key === 'Escape') { e.stopPropagation(); items = []; pinta(); }
  });
  caja.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); elige(+d.dataset.i); } });
  return ctl;
}

let cargaPdf;
function cargarPdf() {
  if (window.jspdf?.jsPDF?.API?.autoTable) return Promise.resolve();
  const sc = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('no se cargó el generador de PDF')); document.head.appendChild(s); });
  return cargaPdf ||= sc('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(() => sc('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
    .catch(e => { cargaPdf = null; throw e; });
}
$('pdf').addEventListener('click', async () => {

    const vistaTxt = filtroKpi === 'salieron' ? 'Salieron hoy' : vista === 'patio' ? (filtroKpi === 'PATIO' ? 'En patio' : filtroKpi === 'ANDEN' ? 'En andén' : filtroKpi === 'VACIA' ? 'Vacías' : filtroKpi === 'CARGADA' ? 'Cargadas' : 'Sin salida') : vista === 'salieron' ? 'Salieron' : 'Todas';
    doc.text(`${vistaTxt} · ${lista.length} caja${lista.length === 1 ? '' : 's'} · ${hoy.toLocaleString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`, 28, 56);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...CIELO);
    doc.text('grupo', ancho - 28 - doc.getTextWidth('grupomeja') + 0, 40);
    doc.setTextColor(...MARINO); doc.text('meja', ancho - 28 - doc.getTextWidth('meja'), 40);
    doc.autoTable({
      startY: 68,

      head: [['LÍNEA', 'LLEGADA', 'CAJA NO.', 'PLACA', 'ORIGEN', 'MEDIDA', 'MEJA', 'CLIENTE', 'ESTATUS', 'UBICACIÓN']],
      body: lista.map(c => { const d = c.datos; return [d.linea, fFecha(c.llegada), d.caja, d.placa, d.origen, d.medida ? d.medida + "'" : '', d.meja, d.cliente, d.estatus === 'VACIA' ? 'VACÍA' : d.estatus, d.ubicacion === 'ANDEN' ? 'ANDÉN' : d.ubicacion]; }),
      theme: 'grid',
      styles: { font: 'helvetica', fontSize: 9, halign: 'center', valign: 'middle', cellPadding: 5, textColor: [9, 25, 50], lineColor: [207, 217, 228], lineWidth: 0.5 },
      headStyles: { fillColor: CIELO, textColor: MARINO, fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [243, 246, 250] },
      columnStyles: { 0: { halign: 'left', cellWidth: 130 }, 1: { cellWidth: 62 }, 2: { fontStyle: 'bold', fontSize: 10.5 }, 3: { fontStyle: 'bold' }, 7: { halign: 'left', cellWidth: 130 } },
      didParseCell: d => {
        if (d.section !== 'body' || d.column.index !== 8) return;

        if (d.cell.raw === 'VACÍA') { d.cell.styles.textColor = [26, 166, 209]; d.cell.styles.fontStyle = 'bold'; }
      },
      didDrawPage: () => {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
        doc.text('Reporte de cajas · Página ' + doc.internal.getNumberOfPages(), ancho - 28, alto - 16, { align: 'right' });
      },
    });
    doc.save('REPORTE_CAJAS_' + hoy.toISOString().slice(0, 10) + '.pdf');
  } catch (e) { aviso('No se pudo generar el PDF: ' + e.message, true); }
  finally { b.disabled = false; }
