<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OP Manzanillo · MEJAnet v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra de marca + pestañas; vistas Ejecutivo / Seguimiento / Gastos; la ficha del embarque se abre como panel lateral sobre cualquier vista. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F7F7F9; --line:#DCDEE3; --line-2:#ECEDF0;
  --ink:#1B1F27; --ink-2:#4A5160; --ink-3:#7A8191;
  --brand:#7A1C1C; --brand-ink:#FFFFFF; --brand-soft:#F5E8E8;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --warn:#A86200; --warn-soft:#FCF0DC; --bad:#C62828; --bad-soft:#FBE6E6; --info:#1F5F8B; --info-soft:#E3EEF6;
  --bar:#3E4A5E;
  --cel-bg1:#FAF6EF; --cel-bg2:#F2ECE1; --cel-line:#E4D7C5; --cel-ink:#5E4E37; --cel-th:#EAE1D3; --cel-ico:#8C7553; --hover-cafe:rgba(140,110,70,.08); --logo:#A3A8AF;
  --st-or:#E46A1C; --st-or-ink:#FFFFFF; --st-or-soft:#FDEBDD;
  --st-ye:#F2C230; --st-ye-ink:#2B2200; --st-ye-soft:#FDF5D2;
  --st-gr:#2E8B57; --st-gr-ink:#FFFFFF; --st-gr-soft:#E2F2E8;
  --st-az:#2F6FD0; --st-az-ink:#FFFFFF; --st-az-soft:#E3EDFB;
  --st-no:#E3E5EA; --st-no-ink:#1B1F27;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:var(--f-body);
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1A1E26; --surface-2:#20252E; --line:#323946; --line-2:#272D37;
  --ink:#E7E9EE; --ink-2:#B3B9C5; --ink-3:#8790A0;
  --brand:#D26A6A; --brand-ink:#1A0A0A; --brand-soft:#3A2224;
  --ok:#4CC38A; --ok-soft:#173A2A; --warn:#E5A445; --warn-soft:#3B2C14; --bad:#F06C6C; --bad-soft:#401C1E; --info:#6AAEDC; --info-soft:#18303F;
  --bar:#8E9AB0;
  --cel-bg1:#2B261F; --cel-bg2:#25211B; --cel-line:#4A4032; --cel-ink:#E6D8C1; --cel-th:#332C23; --cel-ico:#8C7553; --hover-cafe:rgba(230,210,175,.07); --logo:#7E8591;
  --st-or:#E87A33; --st-or-ink:#1A0C02; --st-or-soft:#3A2416;
  --st-ye:#E8BE3A; --st-ye-ink:#211A00; --st-ye-soft:#352E15;
  --st-gr:#45B07A; --st-gr-ink:#06180E; --st-gr-soft:#16301F;
  --st-az:#5B94EA; --st-az-ink:#06122A; --st-az-soft:#17243A;
  --st-no:#2C323D; --st-no-ink:#E7E9EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1A1E26; --surface-2:#20252E; --line:#323946; --line-2:#272D37;
  --ink:#E7E9EE; --ink-2:#B3B9C5; --ink-3:#8790A0;
  --brand:#D26A6A; --brand-ink:#1A0A0A; --brand-soft:#3A2224;
  --ok:#4CC38A; --ok-soft:#173A2A; --warn:#E5A445; --warn-soft:#3B2C14; --bad:#F06C6C; --bad-soft:#401C1E; --info:#6AAEDC; --info-soft:#18303F;
  --bar:#8E9AB0;
  --cel-bg1:#2B261F; --cel-bg2:#25211B; --cel-line:#4A4032; --cel-ink:#E6D8C1; --cel-th:#332C23; --cel-ico:#8C7553; --hover-cafe:rgba(230,210,175,.07); --logo:#7E8591;
  --st-or:#E87A33; --st-or-ink:#1A0C02; --st-or-soft:#3A2416;
  --st-ye:#E8BE3A; --st-ye-ink:#211A00; --st-ye-soft:#352E15;
  --st-gr:#45B07A; --st-gr-ink:#06180E; --st-gr-soft:#16301F;
  --st-az:#5B94EA; --st-az-ink:#06122A; --st-az-soft:#17243A;
  --st-no:#2C323D; --st-no-ink:#E7E9EE; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* Header */
@media (max-width:760px){header.top{position:static!important}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 18px;padding-block:10px}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.title-wrap small{font-size:12px;color:var(--ink-3)}
/* Título con el azul celeste del botón OP Manzanillo, más tenue */
h1.titulo{display:inline-flex;align-items:center;gap:12px;margin:0;padding:6px 22px 6px 6px;border-radius:14px;
  background:linear-gradient(180deg,var(--cel-bg1),var(--cel-bg2));border:1px solid var(--cel-line);box-shadow:0 2px 0 var(--cel-line),0 6px 16px rgba(140,117,83,.14);
  color:var(--cel-ink);font-family:"Oswald","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:27px;letter-spacing:1.2px;line-height:1.1;white-space:nowrap}
h1.titulo .ico{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;color:var(--cel-ico);box-shadow:inset 0 -3px 6px rgba(0,0,0,.05)}
h1.titulo .ico svg{width:34px;height:34px}
.right{display:flex;flex-direction:column;align-items:stretch;gap:8px;justify-self:end;min-width:330px}
.right nav.tabs button{flex:1;text-align:center}
.right .actions{flex-wrap:nowrap!important}
.right .actions .btn{flex:1;justify-content:center;text-align:center;white-space:nowrap}
@media (max-width:980px){.top .wrap{grid-template-columns:1fr}.brand,.title-wrap,.right{justify-self:center;align-items:center}h1.titulo{font-size:21px;white-space:normal}}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:block;flex:none}.logo img{height:40px;width:auto;display:block}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand small{display:block;font-size:12px;color:var(--ink-3);font-family:var(--f-body)}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
nav.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:500;color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.top .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--r);font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:14px;position:sticky;top:var(--hh,0px);z-index:19;background:var(--bg)}
.seg-head{position:sticky;top:calc(var(--hh,0px) + var(--fh,0px));z-index:18;background:var(--bg)}
.tbl-head{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;overflow:hidden}
@media (max-width:760px){.filters,.seg-head{position:static}}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;min-width:0}
.filters .orden{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.filters input[type=search]{width:240px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.count{color:var(--ink-3);font-size:12.5px;margin-left:auto}
.banner{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:500}

/* Cards / sections */
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 12px;color:var(--ink-2)}
.card h2 .muted{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:12.5px;font-weight:400;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left}
button.kpi:hover{border-color:var(--ink-3)}
.kpi .lbl{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.kpi .val{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:17px;color:var(--ink-3);font-weight:500;margin-left:3px}
.kpi .sub{font-size:12.5px;color:var(--ink-2)}
.kpi.alert .val{color:var(--bad)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:980px){.two,.three{grid-template-columns:1fr}}

/* Month bars */
.months{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:190px;padding-top:18px}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.mcol .b{width:100%;max-width:38px;background:var(--bar);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.mcol .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mcol.cur .b{background:var(--brand)}
.mcol .m{font-size:11.5px;color:var(--ink-3);text-transform:uppercase}
.mcol .d{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}
.legend.top{margin:0 0 8px;color:var(--ink);font-weight:700}
.legend .avance-ley{margin-left:auto}

/* Horizontal bars */
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,160px) 1fr 34px;gap:10px;align-items:center;font-size:13px}
.hb button{all:unset;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb button:hover{color:var(--ink);text-decoration:underline}
.hb .track{height:12px;background:var(--line-2);border-radius:2px;overflow:hidden}
.hb .fill{height:100%;background:var(--bar)}
.hb .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li:hover .t{text-decoration:underline}
.li .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-chip{min-width:104px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.date-chip small{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;font-family:var(--f-body);font-weight:500;margin-top:2px}
.empty{color:var(--ink-3);padding:18px 0;text-align:center}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.sema{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.sema.verde{background:var(--ok)} .sema.rojo{background:var(--bad)}
.sem-verde{color:var(--ok);font-weight:700}
.sem-rojo{color:var(--bad);font-weight:700}
.fd2{display:flex;flex-direction:column;line-height:1.25;font-variant-numeric:tabular-nums}
.fd2 .w{font-size:12px;color:var(--ink-3)}
.fd2 .d{font-weight:600;white-space:nowrap}
.sem-verde .fd2 .w,.sem-rojo .fd2 .w{color:inherit;opacity:.8}
.tr .fd2 .w,.tr .fd2 .d,.tr .ref,.tr .pill{font-size:11.5px}
.nx{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap;white-space:nowrap;margin-top:2px;font-size:11.5px}
.tr .c-port{font-size:11.5px;font-weight:700}
.nx-d{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tr .c-ref .b{white-space:normal}
#v-seg.midiendo .c-ref .a,#v-seg.midiendo .c-ref .b{white-space:nowrap!important}
.cell.c-fd .b,.cell.c-fp .b{white-space:normal}
.cell{overflow:hidden}
.tr .c-cont,.tr .c-eta,.tr .c-fp,.tr .c-tp,.tr .c-fd,.tr .c-tipo,.tr .c-op,.tr .c-term,.tr .c-next{text-align:center}
.tr .c-next .nx{justify-content:center}
.tr .c-eta .fd2,.tr .c-fp .fd2,.tr .c-fd .fd2{align-items:center}
@media (max-width:820px){.tr .c-eta{text-align:right}.tr .c-eta .fd2{align-items:flex-end}}
.cell.c-tp .tp{overflow-wrap:break-word;word-break:normal}
.cell.c-term .term,.cell.c-ff .ff{overflow-wrap:normal;word-break:normal;overflow:hidden;text-overflow:clip}
.cell.c-tp .tp{white-space:normal;overflow:visible;color:var(--ink-2)}
.cell.c-term .term{white-space:normal;overflow:hidden;color:var(--ink-2)}
.cell.c-cont .cn{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;line-height:1.35}
.cell.c-cont .vacio{color:var(--ink-3)}
.cell.c-ff .ff{white-space:normal;overflow:hidden;color:var(--ink-2)}
.tag{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:3px;background:var(--ink-2);color:var(--surface)}
.op{font-weight:800;font-size:11.5px;letter-spacing:.04em;color:var(--cel-ico)}
.tag.FCL{background:#4A3826;color:#EAE1D3} .tag.LCL{background:var(--brand);color:var(--brand-ink)}

/* Tracking table */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:0 0 8px 8px;overflow:hidden}
.tbl > .tr:first-child{border-top:0}
.tr{display:grid;grid-template-columns:var(--refw,150px) minmax(190px,1.2fr) minmax(96px,.55fr) minmax(108px,.6fr) minmax(84px,.8fr) 62px 52px 78px 76px 64px 80px 86px minmax(164px,2.2fr) 54px;gap:9px;align-items:center;padding:0 14px 0 0;border-top:1px solid var(--line-2);width:100%;text-align:left;background:var(--surface);border-left:0;border-right:0;border-bottom:0}
.tr.th{border-top:0;background:var(--cel-th);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--cel-ink);font-weight:700}
.tr>div{padding-block:9px}
.tr>div:first-child{padding-left:14px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.tr.th>div{text-align:center}
.tr.th>div:first-child{align-items:center}
/* Al pasar el mouse la fila se cubre con un café tenue */
.tr:not(.th){position:relative}
.tr:not(.th):hover::after{content:"";position:absolute;inset:0;background:var(--hover-cafe);pointer-events:none}
.tr.s-or{background:var(--st-or-soft)} .tr.s-or>.c-ref{background:var(--st-or);color:var(--st-or-ink)}
.tr.s-ye{background:var(--st-ye-soft)} .tr.s-ye>.c-ref{background:var(--st-ye);color:var(--st-ye-ink)}
.tr.s-az{background:var(--st-az-soft)} .tr.s-az>.c-ref{background:var(--st-az);color:var(--st-az-ink)}
.tr.s-gr{background:var(--st-gr-soft)} .tr.s-gr.sem-r{background:var(--bad-soft)} .tr.s-gr>.c-ref{background:var(--st-gr);color:var(--st-gr-ink)}
.tr[class*=" s-"]>.c-ref .b{color:inherit;opacity:.85}
.swatch{display:inline-block;width:30px;height:16px;border-radius:3px;vertical-align:middle;margin-right:6px;border:1px solid var(--line)}
.st-pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-pill.s-no{background:var(--st-no);color:var(--st-no-ink)} .st-pill.s-or{background:var(--st-or);color:var(--st-or-ink)} .st-pill.s-ye{background:var(--st-ye);color:var(--st-ye-ink)} .st-pill.s-gr{background:var(--st-gr);color:var(--st-gr-ink)} .st-pill.s-az{background:var(--st-az);color:var(--st-az-ink)}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:13.5px!important;align-self:end;padding-bottom:6px}
.chk input{width:auto!important}
.chk-ped{justify-self:start;margin-right:0}
.desp-fila{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:6px 12px;align-items:end}
#fx-semaforo.sem-verde{color:var(--ok);font-weight:800}
#fx-semaforo.sem-rojo{color:var(--bad);font-weight:800}
@media (max-width:640px){.desp-fila{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk-ped:has(input:checked){color:var(--ok)!important;font-weight:800}
.chk-ped input:checked{accent-color:var(--ok)}
.chk-ped input{width:18px!important;height:18px;accent-color:var(--cel-ico);cursor:pointer}
.cell{min-width:0}
.cell .a{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .b{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-bq .a,.c-bq .b{white-space:nowrap;overflow:hidden;text-overflow:clip}
.c-bq .blsp{visibility:hidden}
.ref{font-family:var(--f-body);font-weight:600}
.dots{display:flex;gap:3px;align-items:center}
.dot{width:14px;height:8px;border-radius:2px;background:var(--line)}
.dot.done{background:var(--ink-2)}
.s-or .dot.done{background:var(--st-or)} .s-ye .dot.done{background:#C99A0E} .s-gr .dot.done{background:var(--st-gr)} .s-az .dot.done{background:var(--st-az)}
.dot.na{opacity:.35}
.stage{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1500px){.tr{grid-template-columns:var(--refw,140px) minmax(160px,1.2fr) minmax(82px,.55fr) minmax(84px,.6fr) minmax(76px,.8fr) 60px 52px 70px 70px 60px 76px 76px minmax(140px,2fr) 50px;gap:6px}}

<script>
(function(){
"use strict";
const HITOS=[
  {k:"zarpe",l:"Zarpe en origen",st:"En origen"},
  {k:"arribo",l:"Arribo a Manzanillo",st:"En tránsito"},
  {k:"revalidacion",l:"Revalidación",st:"Por revalidar"},
  {k:"previo",l:"Previo",st:"Por realizar previo"},
  {k:"despacho",l:"Despacho",st:"Por despachar"},
  {k:"retiro",l:"Retiro de puerto",st:"Por retirar"}
];
const CONCEPTOS=["Maniobras / terminal","Almacenaje","Previo","Revalidación / liberación naviera","Desconsolidación (LCL)","Demoras de contenedor","Flete terrestre","Custodia / seguro","Honorarios agencia aduanal","Impuestos y derechos (pedimento)","Otros"];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const now=new Date();
const TODAY=iso(now);
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dn(s){if(!s)return null;const[y,m,d]=s.slice(0,10).split("-").map(Number);return Date.UTC(y,m-1,d)/864e5}
function diff(a,b){return dn(a)-dn(b)}
function addDays(s,n){const t=(dn(s)+n)*864e5;const d=new Date(t);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
const DIA=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESU=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
function partes(s){const[y,m,d]=s.slice(0,10).split("-");return{w:DIA[new Date(Date.UTC(+y,+m-1,+d)).getUTCDay()],d:d.padStart(2,"0")+" "+MESU[+m-1]+" "+y}}
// Una línea: "Sábado 17 OCT 2026"
function fd(s){if(!s)return"—";const p=partes(s);return p.w+" "+p.d}
// Dos líneas: día de la semana arriba, fecha abajo
function fd2(s,vacio){if(!s)return vacio??"—";const p=partes(s);return `<span class="fd2"><span class="w">${p.w}</span><span class="d">${p.d}</span></span>`}
function money(n){return(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})}
$("#hoy").textContent="Puerto de Manzanillo · "+fd(TODAY);

let canWrite=true;
let EMB={};            // id -> doc
let loaded=false;
const ui={view:"ejec",cliente:"",terminal:"",q:"",estado:"activa",tipo:"",orden:"prioridad",open:null,newMode:false,confirmDel:false};
try{const v=localStorage.getItem("om.view");if(v)ui.view=v;const o=localStorage.getItem("om.orden");if(o)ui.orden=o}catch(e){}

/* ---------- derived logic ---------- */
function hit(e,k){return(e.hitos&&e.hitos[k])||{}}
function applicable(e,k){if(k==="previo"){const p=(e.previo||"").toUpperCase();return !p.startsWith("NO")}return true}
function due(h){return h.e||""}
function analyze(e){
  const hs=HITOS.filter(h=>applicable(e,h.k));
  let last=-1;
  hs.forEach((h,i)=>{if(hit(e,h.k).r)last=i});
  let next=null;
  if(e.estado==="activa"){
    const pend=hs.slice(last+1).filter(h=>!hit(e,h.k).r);
    next=pend.find(h=>due(hit(e,h.k)))||pend[0]||null;
  }
  const nextIdx=next?hs.indexOf(next):-1;
  const nh=next?hit(e,next.k):{};
  const nd=due(nh);
  const late=!!(nd&&nd<TODAY);
  const arr=hit(e,"arribo");
  const arrEff=arr.r||(arr.e&&arr.e<=TODAY?arr.e:"");
  const endPort=hit(e,"retiro").r||(e.estado!=="activa"?hit(e,"despacho").r:"")||TODAY;
  const diasPuerto=arr.r?Math.max(0,diff(endPort,arr.r)):null;
  let libres=null;
  if(e.diasLibres&&e.estado==="activa"&&!hit(e,"retiro").r){
    const base=arr.r;
    if(base){const vence=addDays(base,+e.diasLibres);libres={vence,rest:diff(vence,TODAY)}}
  }
  const alerts=[];
  if(e.estado==="activa"){
    if(late)alerts.push({lvl:"bad",txt:next.l+" vencido hace "+diff(TODAY,nd)+" d",short:"Vencido "+diff(TODAY,nd)+" d"});
    if(libres&&libres.rest<0)alerts.push({lvl:"bad",txt:"Días libres vencidos hace "+(-libres.rest)+" d",short:"Libres vencidos"});
    else if(libres&&libres.rest<=3)alerts.push({lvl:"warn",txt:"Días libres vencen "+(libres.rest===0?"hoy":"en "+libres.rest+" d"),short:"Libres "+libres.rest+" d"});
    if(!arr.r&&!arr.e)alerts.push({lvl:"warn",txt:"Sin fecha de arribo",short:"Sin ETA"});
  }
  const stage=e.estado==="cerrada"?"Cerrada":e.estado==="cancelada"?"Cancelada":(next?next.st:"Por cerrar");
  return{hs,last,next,nextIdx,nd,late,arrEff,diasPuerto,libres,alerts,stage,eta:arr.r||arr.e||""};
}
const STATUS={no:"Pendiente ETA y revalidación",or:"Revalidado",az:"Previo programado",ye:"Pedimento pagado · despacho programado",gr:"Desaduanado / cumplido"};
// Verde: despachado. Amarillo: pedimento asignado + pagado + fecha de despacho.
// Azul: hay fecha de previo. Naranja: hay fecha de revalidación. Sin color: lo demás.
function status(e){
  const di=hit(e,"despacho"),pv=hit(e,"previo"),rv=hit(e,"revalidacion");
  if(e.estado==="cerrada"||di.r)return "gr";
  if(e.pedimento&&e.pedimentoPagado&&(di.e||di.r))return "ye";
  if(pv.e||pv.r)return "az";
  if(rv.e||rv.r)return "or";
  return "no";
}
function filtered(opts={}){
  const q=ui.q.trim().toUpperCase();
  return Object.entries(EMB).map(([id,e])=>({id,e,a:analyze(e)})).filter(({e})=>{
    if(ui.cliente&&e.cliente!==ui.cliente)return false;
    if(ui.terminal&&(e.terminal||"")!==ui.terminal)return false;
    if(!opts.ignoreEstado&&ui.estado&&e.estado!==ui.estado)return false;
    if(ui.tipo&&e.tipo!==ui.tipo)return false;
    if(q){const hay=[e.ref,e.cliente,e.buque,e.viaje,e.hbl,e.mbl,e.pedimento,e.mercancia,e.ff,e.factura,e.contenedores].join(" ").toUpperCase();if(!hay.includes(q))return false}
    return true;
  });
}

/* ---------- render: ejecutivo ---------- */
function renderEjec(){
  const all=filtered({ignoreEstado:true});
  const act=all.filter(x=>x.e.estado==="activa");
  const in7=act.filter(x=>!hit(x.e,"arribo").r&&x.a.eta&&x.a.eta>=TODAY&&diff(x.a.eta,TODAY)<=7);
  const enPuerto=act.filter(x=>x.a.arrEff&&!hit(x.e,"despacho").r);
  const ym=TODAY.slice(0,7), y=TODAY.slice(0,4);
  const despMes=all.filter(x=>(hit(x.e,"despacho").r||"").startsWith(ym));
  const cut=addDays(TODAY,-90);
  const ciclos=all.map(x=>{const a=hit(x.e,"arribo").r,f=hit(x.e,"despacho").r;return a&&f&&f>=cut?diff(f,a):null}).filter(v=>v!==null&&v>=0);
  const avg=ciclos.length?ciclos.reduce((s,v)=>s+v,0)/ciclos.length:null;
  const semY=all.filter(x=>x.e.semaforo&&(hit(x.e,"despacho").r||"").startsWith(y));
  const rojos=semY.filter(x=>x.e.semaforo==="rojo").length;
  const alertN=act.filter(x=>x.a.alerts.some(a=>a.lvl==="bad")).length;

  // months
  const curM=now.getMonth();const months=[];
  for(let m=0;m<=curM;m++){
    const key=y+"-"+String(m+1).padStart(2,"0");
    const xs=all.filter(x=>(hit(x.e,"despacho").r||"").startsWith(key));
    const cs=xs.map(x=>{const a=hit(x.e,"arribo").r,f=hit(x.e,"despacho").r;return a&&f?diff(f,a):null}).filter(v=>v!==null&&v>=0);
    months.push({m,n:xs.length,avg:cs.length?cs.reduce((s,v)=>s+v,0)/cs.length:null});
  }
  const maxM=Math.max(1,...months.map(m=>m.n));

  // stages
  const stMap={};act.forEach(x=>{stMap[x.a.stage]=(stMap[x.a.stage]||0)+1});
  const stOrder=HITOS.map(h=>h.st).concat(["Por cerrar"]).filter(s=>stMap[s]);
  const maxS=Math.max(1,...Object.values(stMap));
  const byCli={};act.forEach(x=>{const c=x.e.cliente||"Sin cliente";byCli[c]=(byCli[c]||0)+1});
  const byTer={};act.forEach(x=>{const c=x.e.terminal||"Sin asignar";byTer[c]=(byTer[c]||0)+1});
  const hbars=(obj,kind)=>{const ent=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,8);const mx=Math.max(1,...ent.map(e=>e[1]));
    return ent.length?`<div class="hbars">${ent.map(([k,v])=>`<div class="hb"><button type="button" data-fil="${kind}" data-val="${esc(k)}" title="${esc(k)}">${esc(k)}</button><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><div class="n">${v}</div></div>`).join("")}</div>`:`<div class="empty">Sin operaciones activas</div>`};

  // alerts & upcoming
  const alertas=act.flatMap(x=>x.a.alerts.map(a=>({x,a}))).sort((p,q)=>(p.a.lvl==="bad"?0:1)-(q.a.lvl==="bad"?0:1));
  const up=[];const lim=addDays(TODAY,14);
  act.forEach(x=>{x.a.hs.forEach(h=>{const hh=hit(x.e,h.k);const d=due(hh);if(!hh.r&&d&&d>=TODAY&&d<=lim)up.push({x,h,d})})});
  up.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);

  const gm={MXN:0,USD:0};all.forEach(x=>(x.e.gastos||[]).forEach(g=>{if((g.fecha||"").startsWith(ym))gm[g.moneda||"MXN"]+=+g.importe||0}));

  $("#v-ejec").innerHTML=`
  <div class="kpis">
    <button class="kpi" type="button" data-go="seg" data-est="activa"><span class="lbl">Operaciones activas</span><span class="val">${act.length}</span><span class="sub">${act.filter(x=>x.e.tipo==="LCL").length} LCL · ${act.filter(x=>x.e.tipo==="FCL").length} FCL</span></button>
    <div class="kpi"><span class="lbl">Arriban ≤ 7 días</span><span class="val">${in7.length}</span><span class="sub">${in7.length?esc([...new Set(in7.map(x=>x.e.buque))].slice(0,2).join(", ")):"Sin arribos próximos"}</span></div>
    <div class="kpi"><span class="lbl">En puerto sin despacho</span><span class="val">${enPuerto.length}</span><span class="sub">Arribados, pendientes de modular</span></div>
    <div class="kpi ${alertN?"alert":""}"><span class="lbl">Con hito vencido</span><span class="val">${alertN}</span><span class="sub">La fecha estimada ya pasó</span></div>
    <div class="kpi"><span class="lbl">Despachadas en ${MES[curM]}</span><span class="val">${despMes.length}</span><span class="sub">Gastos del mes: $${money(gm.MXN)} MXN${gm.USD?" · US$"+money(gm.USD):""}</span></div>
    <div class="kpi"><span class="lbl">Arribo → despacho</span><span class="val">${avg===null?"—":avg.toFixed(1)}<small>días</small></span><span class="sub">Promedio últimos 90 días · ${ciclos.length} ops.</span></div>
    <div class="kpi"><span class="lbl">Reconocimiento aduanero</span><span class="val">${semY.length?Math.round(rojos/semY.length*100):"—"}<small>%</small></span><span class="sub">${rojos} rojos de ${semY.length} modulaciones ${y}</span></div>
  </div>
  <div class="two">
    <div class="card"><h2>Despachos concluidos por mes <span class="muted">${y} · días promedio arribo → despacho</span></h2>
      <div class="months">${months.map(m=>`<div class="mcol ${m.m===curM?"cur":""}"><div class="b" style="height:${m.n/maxM*130}px"><span>${m.n||""}</span></div><div class="m">${MES[m.m]}</div><div class="d">${m.avg===null?"·":m.avg.toFixed(1)+" d"}</div></div>`).join("")}</div>
    </div>
    <div class="card"><h2>Activas por etapa <span class="muted">siguiente hito pendiente</span></h2>
      ${stOrder.length?`<div class="hbars">${stOrder.map(s=>`<div class="hb"><span title="${esc(s)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)">${esc(s)}</span><div class="track"><div class="fill" style="width:${stMap[s]/maxS*100}%"></div></div><div class="n">${stMap[s]}</div></div>`).join("")}</div>`:`<div class="empty">Sin operaciones activas</div>`}
    </div>
  </div>
  <div class="two">
    <div class="card"><h2>Requiere atención <span class="muted">${alertas.length}</span></h2>
      <div class="list">${alertas.slice(0,12).map(({x,a})=>`<button type="button" class="li" data-open="${esc(x.id)}"><span class="pill ${a.lvl}">${esc(a.short)}</span><span style="min-width:0"><div class="t"><span class="ref">${esc(x.e.ref)}</span> · ${esc(x.e.buque)}</div><div class="s">${esc(a.txt)} · ${esc(x.e.cliente)}</div></span><span class="muted" style="font-size:12px">${esc(x.e.terminal||"")}</span></button>`).join("")||`<div class="empty">Todo al corriente</div>`}</div>
    </div>
    <div class="card"><h2>Próximos 14 días <span class="muted">hitos programados</span></h2>
      <div class="list">${up.slice(0,12).map(u=>`<button type="button" class="li" data-open="${esc(u.x.id)}"><span class="date-chip">${fd2(u.d)}</span><span style="min-width:0"><div class="t">${esc(u.h.l)} · <span class="ref">${esc(u.x.e.ref)}</span></div><div class="s">${esc(u.x.e.buque)} ${esc(u.x.e.viaje||"")} · ${esc(u.x.e.cliente)}</div></span><span class="pill">Estimada</span></button>`).join("")||`<div class="empty">Sin hitos en las próximas dos semanas</div>`}</div>
    </div>
  </div>
  <div class="two">
    <div class="card"><h2>Activas por cliente</h2>${hbars(byCli,"cliente")}</div>
    <div class="card"><h2>Activas por terminal</h2>${hbars(byTer,"terminal")}</div>
  </div>`;
}

/* ---------- render: seguimiento ---------- */
// Orden de la tabla según «Ordenar por»
const RANGO={ye:0,az:1,or:2,no:3,gr:4};
function numRef(r){const m=/^MA(\d+)\/(\d+)/.exec(r||"");return m?(+m[2])*10000+(+m[1]):-1}
function fechaDesp(e){const h=hit(e,"despacho");return h.r||h.e||""}
function prioridad(p,q){
  const pc=p.e.estado!=="activa",qc=q.e.estado!=="activa";
  if(pc!==qc)return pc?1:-1;
  if(pc)return fechaDesp(q.e).localeCompare(fechaDesp(p.e));
  const pa=p.a.alerts.some(a=>a.lvl==="bad")?0:1,qa=q.a.alerts.some(a=>a.lvl==="bad")?0:1;if(pa!==qa)return pa-qa;
  return (p.a.nd||"9999").localeCompare(q.a.nd||"9999");
}
function ordenar(p,q){
  switch(ui.orden){
    case "estatus":{const d=RANGO[status(p.e)]-RANGO[status(q.e)];return d||prioridad(p,q)}
    case "eta":return (p.a.eta||"9999").localeCompare(q.a.eta||"9999")||prioridad(p,q);
    case "despacho":{const a=fechaDesp(p.e),b=fechaDesp(q.e);if(!a!==!b)return a?-1:1;return b.localeCompare(a)||prioridad(p,q)}
    case "ref":return numRef(q.e.ref)-numRef(p.e.ref);
    case "cliente":return (p.e.cliente||"").localeCompare(q.e.cliente||"")||numRef(q.e.ref)-numRef(p.e.ref);
    case "puerto":return (q.a.diasPuerto??-1)-(p.a.diasPuerto??-1)||prioridad(p,q);
    default:return prioridad(p,q);
  }
}
// Separa un campo de B/L que trae varios números ("A // B", "BL: A / BL: B", "A - MBL: B") en una lista
function partirBL(txt){
  const out={bl:[],mbl:[]};
  String(txt||"").split(/\s*\/\/\s*|\s+\/\s+|\s+-\s+/).forEach(p=>{
    p=p.trim();if(!p)return;
    const esMbl=/^MBL\s*:/i.test(p);
    p=p.replace(/^((H|M)?BL\s*:\s*)+/i,"").trim();
    if(p)(esMbl?out.mbl:out.bl).push(p);
  });
  return out;
}
// Líneas de HBL y MBL: una por cada número de B/L
function lineasBL(e){
  const h=partirBL(e.hbl),m=partirBL(e.mbl);
  const hbl=h.bl, mbl=m.bl.concat(h.mbl).concat(m.mbl);
  const lin=(lbl,arr)=>(arr.length?arr:["—"]).map((v,i)=>`<div class="b" title="${esc(v)}">${i?`<span class="blsp">${lbl}:</span>`:lbl+":"} ${esc(v)}</div>`).join("");
  return lin("HBL",hbl)+lin("MBL",mbl);
}
// Fecha de un hito para la tabla: la real si existe, si no la estimada
function celdaFecha(e,k){
  if(!applicable(e,k))return `<div class="b">No aplica</div>`;
  const h=hit(e,k),d=h.r||h.e;
  if(!d)return `<div class="b">—</div>`;
  return `<div class="a">${fd2(d)}</div><div class="b">${h.r?"Real":"Estimada"}${!h.r&&h.hora?" · "+esc(h.hora):""}</div>`;
}
function dotsHTML(e,a){
  const closed=e.estado==="cerrada";
  return `<div class="dots" aria-label="Avance de hitos">${HITOS.map(h=>{
    const hh=hit(e,h.k);const i=a.hs.indexOf(h);const na=!applicable(e,h.k);

// Si el buque, HBL o MBL no cabe en su línea, se reduce el tamaño de la letra solo en ese dato
function ajustarBuque(){
  if($("#v-seg").hidden)return;
  document.querySelectorAll("#v-seg .c-ff .ff, #v-seg .c-term .term").forEach(el=>{
    el.style.fontSize="";
    let fs=parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth>el.clientWidth&&fs>8.5){fs-=.5;el.style.fontSize=fs+"px"}
  });
  document.querySelectorAll("#v-seg .c-bq .a, #v-seg .c-bq .b").forEach(el=>{
    el.style.fontSize="";el.style.whiteSpace="";
    let fs=parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth>el.clientWidth+1&&fs>7){fs-=.5;el.style.fontSize=fs+"px"}
    if(el.scrollWidth>el.clientWidth+1){el.style.whiteSpace="normal";el.style.overflowWrap="anywhere"} // caso extremo: pasa a otra línea antes que cortarse
  });
}

// La columna Referencia toma el ancho del texto más largo (referencia o cliente) para que se lea completo
function ajustarRef(){
  const tbl=$("#v-seg");if(!tbl||tbl.hidden)return;
  // Se mide el ancho del texto mismo (no el de la celda), así el resultado no crece en cada actualización
  // Se mide con el texto en una sola línea, para que el resultado no dependa del ancho actual
  tbl.classList.add("midiendo");
  const rg=document.createRange();let w=0;
  tbl.querySelectorAll(".tr:not(.th) .c-ref .a, .tr:not(.th) .c-ref .b").forEach(el=>{rg.selectNodeContents(el);w=Math.max(w,rg.getBoundingClientRect().width)});
  tbl.classList.remove("midiendo");
  if(w)tbl.style.setProperty("--refw",Math.min(Math.ceil(w)+30,window.innerWidth<1300?160:window.innerWidth<1600?180:215)+"px");
}
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{ajustarRef();ajustarBuque()},150)});
// Cuando terminan de cargar los tipos de letra, se recalculan los anchos con la letra definitiva
function reajustar(){ajustarRef();ajustarBuque();if(typeof medirFijos==="function")medirFijos()}
if(document.fonts){document.fonts.ready.then(reajustar);document.fonts.addEventListener&&document.fonts.addEventListener("loadingdone",reajustar)}

async function api(method,url,body){

let qT;$("#f-q").addEventListener("input",ev=>{clearTimeout(qT);qT=setTimeout(()=>{ui.q=ev.target.value;renderAll()},150)});

function syncSeg(){
  document.querySelectorAll("#f-estado button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.e===ui.estado)));
  document.querySelectorAll("#f-tipo button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===ui.tipo)));
}
function setView(v){ui.view=v;try{localStorage.setItem("om.view",v)}catch(e){}
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===v)));
  $("#v-ejec").hidden=v!=="ejec";$("#v-seg").hidden=v!=="seg";$("#v-gas").hidden=v!=="gas";
  $("#f-estado").hidden=v==="ejec";$("#f-orden-w").hidden=v!=="seg";renderAll();}
function fillSelect(id,vals,cur,all){const s=$(id);const html=`<option value="">${all}</option>`+vals.map(v=>`<option ${v===cur?"selected":""}>${esc(v)}</option>`).join("");if(s.dataset.h!==html){s.innerHTML=html;s.dataset.h=html}s.value=cur}
function renderAll(){
  fillSelect("#f-cliente",clientes(),ui.cliente,"Todos los clientes");
  fillSelect("#f-terminal",terminales(),ui.terminal,"Todas las terminales");
  const n=filtered({ignoreEstado:ui.view==="ejec"}).length;
  $("#f-count").textContent=loaded?n+" embarque"+(n===1?"":"s"):"";
  if(ui.view==="ejec")renderEjec();else if(ui.view==="seg")renderSeg();else renderGas();
  medirFijos();
}
// Alturas del encabezado y de los filtros, para que la leyenda y los títulos queden fijos justo debajo
function medirFijos(){
  const r=document.documentElement.style;
  r.setProperty("--hh",$("header.top").offsetHeight+"px");
  r.setProperty("--fh",$(".filters").offsetHeight+"px");
}
window.addEventListener("resize",()=>{clearTimeout(window.__mf);window.__mf=setTimeout(medirFijos,150)});

/* ---------- export ---------- */
function csvCell(v){v=v==null?"":String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCSV(){
  const xs=filtered({ignoreEstado:ui.view==="ejec"});
  const base=["ref","operacion","cliente","estado","buque","viaje","bandera","terminal","claveCR","ff","hbl","mbl","contenedores","tipo","previo","mercancia","marca","factura","peso","bultos","pedimento","pedimentoPagado","semaforo","semaforoFecha","diasLibres","nota"];
  const hcols=[];HITOS.forEach(h=>["e","r"].forEach(k=>hcols.push([h.k,k])));
  const head=base.concat(hcols.map(([h,k])=>h+"_"+({e:"estimada",r:"real"})[k]),["total_mxn","total_usd"]);
  const lines=[head.join(",")];
  xs.forEach(({e})=>{const t={MXN:0,USD:0};(e.gastos||[]).forEach(g=>t[g.moneda||"MXN"]+=+g.importe||0);
    lines.push(base.map(f=>csvCell(e[f])).concat(hcols.map(([h,k])=>csvCell(hit(e,h)[k])),[t.MXN.toFixed(2),t.USD.toFixed(2)]).join(","))});
  const g=["ref,cliente,fecha,concepto,proveedor,importe,moneda,pagado"];
  xs.forEach(({e})=>(e.gastos||[]).forEach(x=>g.push([e.ref,e.cliente,x.fecha,x.concepto,x.proveedor,x.importe,x.moneda,x.pagado?"SI":"NO"].map(csvCell).join(","))));
  bajar("embarques_manzanillo_"+TODAY+".csv",lines);
  if(g.length>1)setTimeout(()=>bajar("gastos_manzanillo_"+TODAY+".csv",g),400);
}

/* ---------- boot ---------- */
$("#f-orden").value=ui.orden;if(!$("#f-orden").value){ui.orden="prioridad";$("#f-orden").value="prioridad"}
syncSeg();setView(["ejec","seg","gas"].includes(ui.view)?ui.view:"ejec");
load();
setInterval(()=>{if(!document.hidden&&!isEditing())load()},60000); // trae cambios de otros usuarios cada minuto
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!isEditing())load()});
})();
</script>
