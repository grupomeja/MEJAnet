<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COTIZADOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cotizador.css">
<style>
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
  .kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
  .kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .ENVIADA{color:var(--accent)} .kpi .ACEPTADA{color:var(--ok)} .kpi .RECHAZADA{color:var(--err)}
  .filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px;align-items:end}
  .tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{position:sticky;top:0;background:var(--soft);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;white-space:nowrap}
  tr:hover td{background:color-mix(in srgb,var(--cot) 5%,transparent)}
  td.folio a{font-weight:800;color:var(--cot);text-decoration:none;white-space:nowrap}
  td.cli b{display:block}
  td.cli small{color:var(--muted)}
  td.monto{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td.monto small{color:var(--muted);font-size:11px;margin-left:3px}
  td.acciones{white-space:nowrap;text-align:right}
  select.estado{width:auto;padding:4px 8px;font-size:12px;font-weight:700;border-radius:999px}
  @media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.filtros{grid-template-columns:1fr 1fr}.filtros .q{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="logo" href="/" aria-label="MEJAnet"><img src="/logo.png" alt="Grupo Meja"></a>
    <h1 class="titulo"><span class="ico" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="12" y="4" width="40" height="56" rx="5" fill="currentColor"/><rect x="17" y="10" width="30" height="14" rx="2" fill="#fff"/><text x="42" y="21.5" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="11" fill="currentColor">$</text><g fill="#fff"><rect x="17" y="29" width="8" height="6" rx="1"/><rect x="28" y="29" width="8" height="6" rx="1"/><rect x="39" y="29" width="8" height="6" rx="1"/><rect x="17" y="38.5" width="8" height="6" rx="1"/><rect x="28" y="38.5" width="8" height="6" rx="1"/><rect x="39" y="38.5" width="8" height="15.5" rx="1"/><rect x="17" y="48" width="8" height="6" rx="1"/><rect x="28" y="48" width="8" height="6" rx="1"/></g></svg></span>COTIZADOR</h1>
    <div class="acc"><a class="nuevo" href="/cotizador/nueva">+ Nueva Cotización</a><a href="/cotizador/tarifas">Conceptos</a><a href="/">MEJAnet</a></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="filtros">
    <div class="q"><label for="q">Buscar</label><input id="q" type="search" placeholder="Folio, cliente, tráfico, naviera…"></div>
    <div><label for="fEstado">Estado</label><select id="fEstado"><option value="">Todos</option><option>BORRADOR</option><option>ENVIADA</option><option>ACEPTADA</option><option>RECHAZADA</option></select></div>
    <div><label for="fDesde">Desde</label><input id="fDesde" type="date"></div>
    <div><label for="fHasta">Hasta</label><input id="fHasta" type="date"></div>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Tráfico</th><th style="text-align:right">Total USD</th><th style="text-align:right">Total MXN</th><th>Estado</th><th></th></tr></thead>
      <tbody id="lista"><tr><td colspan="9" class="vacio">Cargando…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dinero = (x) => (Number(x) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fecha = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const ESTADOS = ['BORRADOR', 'ENVIADA', 'ACEPTADA', 'RECHAZADA'];
const ICO_PDF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14h6M9 17h4"/></svg>';
const ICO_COPIA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICO_BORRAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
let todas = [];

async function cargar() {
  try {
    const r = await fetch('/api/admin/cot/cotizaciones');
    if (!r.ok) throw new Error();
    todas = await r.json();
    pintar();
  } catch { $('lista').innerHTML = '<tr><td colspan="9" class="vacio">No se pudieron cargar las cotizaciones.</td></tr>'; }
}

function filtradas() {
  const q = $('q').value.trim().toLowerCase(), est = $('fEstado').value, d = $('fDesde').value, h = $('fHasta').value;
  return todas.filter((c) => {
    const x = c.datos;
    if (est && x.estado !== est) return false;
    if (d && x.fecha < d) return false;
    if (h && x.fecha > h) return false;
    if (q) {
      const hay = [c.folio_txt, x.cliente, x.trafico, x.tipo, x.naviera, x.contenedor, x.proveedor].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function pintar() {
  const lista = filtradas();
  const cuenta = (e) => todas.filter((c) => c.datos.estado === e).length;
  $('kpis').innerHTML = `<div class="kpi"><b>${todas.length}</b><span>Cotizaciones</span></div>` +
    ['ENVIADA', 'ACEPTADA', 'RECHAZADA'].map((e) => `<div class="kpi"><b class="${e}">${cuenta(e)}</b><span>${e === 'ENVIADA' ? 'Enviadas' : e === 'ACEPTADA' ? 'Aceptadas' : 'Rechazadas'}</span></div>`).join('');
  if (!lista.length) {
    $('lista').innerHTML = `<tr><td colspan="9" class="vacio">${todas.length ? 'Ninguna cotización coincide con el filtro.' : 'Todavía no hay cotizaciones. <a href="/cotizador/nueva">Crea la primera</a>.'}</td></tr>`;
    return;
  }
  $('lista').innerHTML = lista.map((c) => {
    const x = c.datos;
    const monto = (v, m) => v ? `$${dinero(v)}<small>${m}</small>` : '<span class="muted">—</span>';
    const tipo = { TERRESTRE: 'Terrestre', MARITIMA: 'Marítima', FFCC: 'FFCC' }[x.tipo] || '';
    const det = [x.operacion === 'IMPORTACION' ? 'Importación' : x.operacion === 'EXPORTACION' ? 'Exportación' : '', x.contenedor, x.modalidad].filter(Boolean).join(' · ');
    return `<tr data-id="${c.id}">
      <td class="folio"><a href="/cotizador/editar/${c.id}">${esc(c.folio_txt)}</a></td>
      <td>${fecha(x.fecha)}</td>
      <td class="cli"><b>${esc(x.cliente) || '<span class="muted">Sin cliente</span>'}</b>${x.naviera ? `<small>${esc(x.naviera)}</small>` : ''}</td>
      <td>${tipo}${det ? `<br><small class="muted">${esc(det)}</small>` : ''}</td>
      <td>${esc(x.trafico) || '<span class="muted">—</span>'}</td>
      <td class="monto">${monto(c.totalUSD, 'USD')}</td>
      <td class="monto">${monto(c.totalMXN, 'MXN')}</td>
      <td><select class="estado pill ${x.estado}" aria-label="Estado">${ESTADOS.map((s) => `<option${s === x.estado ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
      <td class="acciones">
        <a class="ico-btn" title="Ver PDF" target="_blank" href="/api/admin/cot/cotizaciones/${c.id}/pdf">${ICO_PDF}</a>
        <a class="ico-btn" title="Duplicar" href="/cotizador/nueva?copia=${c.id}">${ICO_COPIA}</a>
        <button class="ico-btn borrar" title="Borrar">${ICO_BORRAR}</button>
      </td></tr>`;
  }).join('');
}

$('lista').addEventListener('change', async (ev) => {
  const sel = ev.target.closest('select.estado'); if (!sel) return;
  const id = Number(sel.closest('tr').dataset.id), c = todas.find((x) => x.id === id);
  const antes = c.datos.estado;
  sel.className = `estado pill ${sel.value}`;
  try {
    const r = await fetch(`/api/admin/cot/cotizaciones/${id}/estado`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: sel.value }) });
    if (!r.ok) throw new Error();
    c.datos.estado = sel.value; pintar();
  } catch { alert('No se pudo cambiar el estado.'); c.datos.estado = antes; pintar(); }
});
$('lista').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button.borrar'); if (!b) return;
  const id = Number(b.closest('tr').dataset.id), c = todas.find((x) => x.id === id);
  if (!confirm(`¿Borrar la cotización ${c.folio_txt}${c.datos.cliente ? ' de ' + c.datos.cliente : ''}? No se puede deshacer.`)) return;
  b.disabled = true;
  const r = await fetch(`/api/admin/cot/cotizaciones/${id}`, { method: 'DELETE' }).catch(() => null);
  if (!r || !r.ok) { alert('No se pudo borrar.'); b.disabled = false; return; }
  todas = todas.filter((x) => x.id !== id); pintar();
});
for (const id of ['q', 'fEstado', 'fDesde', 'fHasta']) $(id).addEventListener('input', pintar);
cargar();
</script>
</body>
</html>
