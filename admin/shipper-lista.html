<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reportes Shipper Normal · MEJAnet v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f8fb;--ink:#0b1a33;--muted:#5d6672;--line:#c9d4e0;--c:#2e8b57;--c-osc:#1f6640;--head:#2e8b57;--alt:#f0f8f3;--tot:#ddefe4;--en:#1f6640;--warn:#a86200;--warn-bg:#fcf0dc;--err:#c0262d;--err-bg:#fff5f5;--ok:#1e7a4c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:1800px;margin:0 auto;padding:18px max(16px,2vw) 40px}
  /* Encabezado como el resto de MEJAnet: logo en el color del módulo, título al centro con el ícono de su botón */
  header{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 16px;align-items:center;margin-bottom:18px}
  header .logo{justify-self:start}
  header .marca{display:block;width:162px;height:40px;background:var(--c);-webkit-mask:url(/logo.png) left center/contain no-repeat;mask:url(/logo.png) left center/contain no-repeat}
  header .tit{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  h1.titulo{display:inline-flex;align-items:center;gap:12px;margin:0;padding:6px 22px 6px 6px;border-radius:14px;
    background:linear-gradient(180deg,#eef8f2,#dcf0e4);border:1px solid #b5dcc5;box-shadow:0 2px 0 #a9d3ba,0 6px 16px rgba(46,139,87,.16);
    color:var(--c);font-family:"Oswald","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:27px;letter-spacing:1.2px;line-height:1.1;white-space:nowrap;text-transform:uppercase}
  h1.titulo .ico{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;color:var(--c);box-shadow:inset 0 -3px 6px rgba(0,0,0,.05)}
  h1.titulo .ico svg{width:34px;height:34px}
  header small{color:var(--muted)}
  header .volver{justify-self:end}
  @media (max-width:760px){header{grid-template-columns:1fr;justify-items:center}header .logo,header .volver{justify-self:center}h1.titulo{font-size:21px;white-space:normal}}
  a.volver{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);text-decoration:none;font-weight:700;font-size:13px}
  a.volver:hover{color:var(--ink);border-color:var(--ink)}
  a.volver svg{width:16px;height:16px}


  /* Barra: búsqueda, fechas y nuevo reporte */
  .barra{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
  .campo{display:flex;flex-direction:column;gap:3px}
  .campo label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .campo input{font:inherit;font-size:13.5px;padding:7px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  .campo input:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px #d6eee0}
  .campo.q{flex:1 1 280px;max-width:460px}
  .barra .quitar{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer}
  .barra .quitar:hover{color:var(--ink);border-color:var(--ink)}
  .barra .cuenta{font-size:13px;color:var(--muted);padding-bottom:8px}
  .barra .cuenta b{color:var(--ink)}
  a.nuevo{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;background:var(--c);color:#fff;text-decoration:none;
    font:600 15px "Oswald","Arial Narrow",system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;box-shadow:0 3px 0 var(--c-osc)}
  a.nuevo:hover{filter:brightness(1.07)}
  a.nuevo:active{transform:translateY(2px);box-shadow:0 1px 0 var(--c-osc)}
  a.nuevo svg{width:18px;height:18px}
  :focus-visible{outline:3px solid #4fc9ee;outline-offset:2px}

  /* Lista */
  .tabla{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px;color:#2b3038}
  th{background:var(--head);color:#fff;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;text-align:left;white-space:nowrap}
  th.n,td.n{text-align:right}
  td{padding:9px 10px;border-top:1px solid #e3ece6;vertical-align:middle;font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:#f3faf6}
  td.ref a{color:var(--c-osc);font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:18px;text-decoration:none;letter-spacing:.02em}
  td.ref a:hover{text-decoration:underline}
  td .sub{display:block;font-size:11.5px;color:var(--muted)}
  td.archivo{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  td.prov{max-width:280px;font-size:12px;color:var(--muted)}
  .chip{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:999px;vertical-align:1px}
  td.acc{white-space:nowrap;text-align:right}
  td.acc a,td.acc button{font:inherit;font-size:12.5px;font-weight:600;padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer;margin-left:4px}
  td.acc a:hover,td.acc button:hover{border-color:var(--c);color:var(--c-osc)}
  td.acc button.borrar:hover{border-color:var(--err);color:var(--err);background:var(--err-bg)}
  td.acc .seguro{color:var(--err);font-size:12.5px;font-weight:600;margin-right:2px}
  td.acc button.si{background:var(--err);border-color:var(--err);color:#fff}
  td.acc button.si:hover{color:#fff;filter:brightness(1.08);background:var(--err)}
  .vacio{padding:40px 16px;text-align:center;color:var(--muted)}
  .vacio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
  .msg{margin:0 0 12px;padding:10px 14px;border-radius:8px;font-size:13.5px;background:var(--err-bg);color:var(--err);border:1px solid #f1c4c6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/modulos" aria-label="MEJAnet"><span class="marca" role="img" aria-label="Grupo Meja"></span></a>
    <div class="tit">
      <h1 class="titulo"><span class="ico" aria-hidden="true"><svg viewBox="0 0 64 64"> <path d="M14 4h26l12 12v44a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="currentColor"/> <path d="M40 4v12h12z" fill="#fff" opacity=".55"/> <g fill="#fff"><rect x="18" y="12" width="16" height="3"/><rect x="18" y="19" width="26" height="2.4"/><rect x="18" y="24" width="22" height="2.4"/></g> <path d="M20 34l12-5 12 5v14l-12 5-12-5z" fill="#fff"/> <path d="M20 34l12 5 12-5M32 39v14" fill="none" stroke="currentColor" stroke-width="2"/> </svg></span>Reportes Shipper Normal</h1>
      <small>Reportes convertidos. Se guardan solos al generarse y con cada cambio.</small>
    </div>
    <a class="volver" href="/herramientas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> Herramientas</a>
  </header>

  <div class="barra">
    <div class="campo q"><label for="q">Buscar</label><input id="q" type="search" placeholder="Referencia, archivo, proveedor o usuario…"></div>
    <div class="campo"><label for="desde">Desde</label><input id="desde" type="date"></div>
    <div class="campo"><label for="hasta">Hasta</label><input id="hasta" type="date"></div>
    <button type="button" class="quitar" id="quitar" hidden>Quitar filtros</button>
    <span class="cuenta" id="cuenta"></span>
    <a class="nuevo" href="/herramientas/shipper-normal/reporte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Nuevo reporte</a>
  </div>
  <div class="msg" id="msg" hidden></div>
  <div class="tabla">
    <table>
      <thead><tr><th>Referencia</th><th>Fecha</th><th>Última modificación</th><th>Archivo</th><th class="n">Partidas</th><th class="n">Fracciones</th><th class="n">Valor</th><th class="n">Peso kg</th><th>Proveedores</th><th><span style="position:absolute;width:1px;height:1px;overflow:hidden">Acciones</span></th></tr></thead>
      <tbody id="lista"><tr><td colspan="10" class="vacio">Cargando reportes…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const dinero = n => '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kg = n => (Number(n) || 0).toLocaleString('es-MX', { maximumFractionDigits: 3 });
const fecha = d => new Date(d).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
const hora = d => new Date(d).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
const diaLocal = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
let reportes = [], confirmar = null;

async function cargar() {
  try {
    const r = await fetch('/api/shipper');
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = '/?next=' + encodeURIComponent(location.pathname); return; }
    if (!r.ok) throw new Error(j.error || 'el servidor respondió ' + r.status);
    reportes = j.reportes || [];
    pintar();
  } catch (e) {
    $('lista').innerHTML = '<tr><td colspan="10" class="vacio">No se pudo cargar la lista: ' + esc(e.message) + '</td></tr>';
  }
}

function pintar() {
  const q = norm($('q').value.trim()), d = $('desde').value, h = $('hasta').value;
  const hay = !!(q || d || h);
  const xs = reportes.filter(x => {
    const dia = diaLocal(x.creado);
    if (d && dia < d) return false;
    if (h && dia > h) return false;
    if (!q) return true;
    return norm([x.referencia, x.archivo, x.creado_por, x.actualizado_por, ...(x.resumen?.proveedores || [])].join(' ')).includes(q);
  });
  $('quitar').hidden = !hay;
  $('cuenta').innerHTML = reportes.length ? (hay ? `<b>${xs.length}</b> de ${reportes.length} reportes` : `<b>${reportes.length}</b> reporte${reportes.length === 1 ? '' : 's'}`) : '';
  if (!reportes.length) {
    $('lista').innerHTML = '<tr><td colspan="10" class="vacio"><b>Todavía no hay reportes guardados</b>Usa <i>Nuevo reporte</i> y sube el archivo repclasxls: el reporte aparecerá aquí en cuanto se genere.</td></tr>';
    return;
  }
  if (!xs.length) { $('lista').innerHTML = '<tr><td colspan="10" class="vacio">Ningún reporte coincide con la búsqueda.</td></tr>'; return; }
  $('lista').innerHTML = xs.map(x => {
    const r = x.resumen || {}, url = '/herramientas/shipper-normal/reporte?id=' + x.id;
    const cambio = new Date(x.actualizado) - new Date(x.creado) > 60000;
    const acc = confirmar === x.id
      ? `<span class="seguro">¿Borrar ${esc(x.referencia)}?</span><button type="button" class="si" data-si="${x.id}">Sí, borrar</button><button type="button" data-no>No</button>`
      : `<a href="${url}">Abrir</a><a href="${url}&pdf=1">PDF</a><button type="button" class="borrar" data-borrar="${x.id}" aria-label="Borrar ${esc(x.referencia)}">Borrar</button>`;
    return `<tr data-url="${url}">
      <td class="ref"><a href="${url}">${esc(x.referencia)}</a></td>
      <td>${fecha(x.creado)}<span class="sub">${hora(x.creado)}${x.creado_por ? ' · ' + esc(x.creado_por) : ''}</span></td>
      <td>${cambio ? fecha(x.actualizado) + '<span class="sub">' + hora(x.actualizado) + (x.actualizado_por ? ' · ' + esc(x.actualizado_por) : '') + '</span>' : '<span class="sub">Sin cambios</span>'}</td>
      <td class="archivo" title="${esc(x.archivo)}">${esc(x.archivo || '—')}</td>
      <td class="n">${r.partidas ?? 0}${r.borradas ? `<span class="chip" title="Partidas que se quitaron del reporte">−${r.borradas}</span>` : ''}</td>
      <td class="n">${r.fracciones ?? 0}</td>
      <td class="n">${dinero(r.valor)}</td>
      <td class="n">${kg(r.peso)}</td>
      <td class="prov">${esc((r.proveedores || []).join(', '))}</td>
      <td class="acc">${acc}</td>
    </tr>`;
  }).join('');
}

$('lista').addEventListener('click', async ev => {
  const t = ev.target;
  if (t.closest('a')) return;
  if (t.dataset.borrar) { confirmar = Number(t.dataset.borrar); pintar(); return; }
  if (t.hasAttribute('data-no')) { confirmar = null; pintar(); return; }
  if (t.dataset.si) {
    const id = Number(t.dataset.si);
    t.disabled = true;
    try {
      const r = await fetch('/api/shipper/' + id, { method: 'DELETE' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok && r.status !== 404) throw new Error(j.error || 'el servidor respondió ' + r.status);
      reportes = reportes.filter(x => x.id !== id); confirmar = null; $('msg').hidden = true; pintar();
    } catch (e) { $('msg').textContent = 'No se pudo borrar el reporte: ' + e.message; $('msg').hidden = false; t.disabled = false; }
    return;
  }
  if (t.closest('td.acc')) return;
  const tr = t.closest('tr[data-url]'); if (tr) location.href = tr.dataset.url;
});
let tq;
$('q').addEventListener('input', () => { clearTimeout(tq); tq = setTimeout(pintar, 120); });
$('desde').addEventListener('change', pintar);
$('hasta').addEventListener('change', pintar);
$('quitar').addEventListener('click', () => { $('q').value = ''; $('desde').value = ''; $('hasta').value = ''; pintar(); });
cargar();
</script>
</body>
</html>
