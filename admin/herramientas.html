<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramientas · MEJAnet v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f8fb;--ink:#0b1a33;--accent:#1f4e8c;--accent-ink:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:520px;padding:20px 16px;text-align:center}
  img{width:min(210px,55%);height:auto;display:block;margin:0 auto 18px}
  h1{margin:0 0 24px;font-size:clamp(28px,7vw,38px);letter-spacing:1px;font-weight:800}
  h1 span{color:#4fc9ee}
  h1 small{font-size:.38em;font-weight:700;color:#5d6672;letter-spacing:.5px;margin-left:6px}
  .botones{display:grid;gap:12px;max-width:320px;margin:0 auto}
  /* Botón: recuadro blanco con el ícono del color del botón + texto sobre el color */
  a.boton{--c:#1f4e8c;--c-osc:#123;display:flex;align-items:stretch;height:54px;border-radius:9px;overflow:hidden;text-decoration:none;
    background:var(--c);box-shadow:0 3px 0 var(--c-osc),0 6px 14px rgba(0,0,0,.16);transition:transform .08s,box-shadow .08s,filter .15s}
  a.boton .ico{flex:0 0 54px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--c);
    border-right:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -6px 10px rgba(0,0,0,.06)}
  a.boton .ico svg{width:38px;height:38px}
  a.boton .txt{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;color:#fff;
    font-family:"Oswald","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:18px;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 55%,rgba(0,0,0,.08));text-shadow:0 1px 1px rgba(0,0,0,.2)}
  a.boton:hover{filter:brightness(1.07)}
  a.boton:active{transform:translateY(2px);box-shadow:0 1px 0 var(--c-osc),0 3px 8px rgba(0,0,0,.16)}
  a.boton:focus-visible{outline:3px solid #4fc9ee;outline-offset:3px}
  @media (max-width:420px){a.boton .txt{font-size:17px;letter-spacing:1px}}
  /* Pantallas bajas (laptops, celular acostado): todo más compacto para que quepa sin bajar */
  @media (max-height:700px){main{padding:12px 16px}img{width:min(160px,45%);margin-bottom:10px}h1{font-size:28px;margin-bottom:16px}.botones{gap:9px}a.boton{height:46px}a.boton .ico{flex-basis:46px}a.boton .ico svg{width:32px;height:32px}a.boton .txt{font-size:16px}a.salir{margin-top:16px}}
  /* Cerrar sesión: botón secundario, discreto debajo de los módulos */
  a.salir{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 18px;border:1.5px solid #c9d4e0;border-radius:999px;
    background:#fff;color:#5d6672;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.3px;transition:color .15s,border-color .15s,background .15s}
  a.salir svg{width:18px;height:18px}
  a.salir:hover{color:#0b1a33;border-color:#0b1a33}
  a.salir:focus-visible{outline:3px solid #4fc9ee;outline-offset:3px}
  a.boton.shipper{--c:#2e8b57;--c-osc:#1f6640}
  a.boton.shippersm{--c:#0e7c86;--c-osc:#095961}
  a.boton.conversion{--c:#5b6b7d;--c-osc:#3f4b59}
  /* Nombres largos: botones un poco más anchos y texto más compacto */
  .botones{max-width:340px}
  a.boton .txt{font-size:16px;letter-spacing:.8px;padding:0 10px}
  @media (max-width:420px){a.boton .txt{font-size:15px;letter-spacing:.6px}}
  h2{margin:-12px 0 20px;font-family:"Oswald","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:22px;letter-spacing:1.5px;text-transform:uppercase;color:#b38a00}
  @media (max-height:700px){h2{margin:-8px 0 14px;font-size:19px}}
</style>
</head>
<body>
<main>
  <a href="/modulos"><img src="/mejanet-logo.png" alt="Grupo Meja"></a>
  <h1>MEJA<span>net</span><small>v1.0</small></h1>
  <h2>Herramientas</h2>
  <div class="botones">
    <a class="boton shipper" href="/herramientas/shipper-normal">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M14 4h26l12 12v44a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="currentColor"/>
          <path d="M40 4v12h12z" fill="#fff" opacity=".55"/>
          <g fill="#fff"><rect x="18" y="12" width="16" height="3"/><rect x="18" y="19" width="26" height="2.4"/><rect x="18" y="24" width="22" height="2.4"/></g>
          <path d="M20 34l12-5 12 5v14l-12 5-12-5z" fill="#fff"/>
          <path d="M20 34l12 5 12-5M32 39v14" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>
      <span class="txt">Reporte Shipper Normal</span>
    </a>
    <a class="boton shippersm" href="/herramientas/shipper-sm">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M14 4h26l12 12v44a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="currentColor"/>
          <path d="M40 4v12h12z" fill="#fff" opacity=".55"/>
          <g fill="#fff"><rect x="18" y="12" width="16" height="3"/><rect x="18" y="19" width="26" height="2.4"/><rect x="18" y="24" width="22" height="2.4"/></g>
          <rect x="17" y="33" width="30" height="20" rx="3" fill="#fff"/>
          <text x="32" y="48.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="14" fill="currentColor">SM</text>
        </svg>
      </span>
      <span class="txt">Reporte Shipper SM</span>
    </a>
    <a class="boton conversion" href="/herramientas/conversion-unidades">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect x="4" y="10" width="56" height="44" rx="7" fill="currentColor"/>
          <text x="17" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="12" fill="#fff">kg</text>
          <text x="47" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="12" fill="#fff">lb</text>
          <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M27 25h18M40 20l5 5-5 5"/><path d="M37 41H19M24 36l-5 5 5 5"/>
          </g>
        </svg>
      </span>
      <span class="txt">Conversión de unidades</span>
    </a>
  </div>
  <a class="salir" href="/modulos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> Módulos</a>
</main>
</body>
</html>
