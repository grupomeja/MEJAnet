<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Módulos · MEJAnet v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script>
  // Tema: lo elegido por el usuario (si lo hay) o el del sistema
  (function(){var t=null;try{t=localStorage.getItem('mejanet-tema')}catch(e){}
   if(t!=='claro'&&t!=='oscuro')t=matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro';
   document.documentElement.dataset.tema=t})();
</script>
<style>
  :root{
    --bg:#f3f6fa;--bg2:#e9eef5;--card:#ffffff;--ink:#0b1a33;--ink2:#56627a;--ink3:#8a94a6;--line:#dfe5ee;
    --navy:#0b1a33;--cyan:#4fc9ee;--hero-ink:#ffffff;--hero-sub:#a9c3dd;
    --shadow:0 1px 2px rgba(11,26,51,.06),0 8px 24px rgba(11,26,51,.06);--shadow-h:0 2px 4px rgba(11,26,51,.08),0 16px 36px rgba(11,26,51,.12);
    --logo:#0b1a33;
  }
  [data-tema="oscuro"]{
    --bg:#0a1120;--bg2:#0e1729;--card:#121c31;--ink:#e8eef8;--ink2:#a3b0c6;--ink3:#6f7c94;--line:#1f2b44;
    --hero-ink:#ffffff;--hero-sub:#8fa7c2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-h:0 2px 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);
    --logo:#e8eef8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 24px}

  /* Barra superior */
  header{position:relative;z-index:2}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:80px}
  .logo{display:block;width:204px;height:50px;background:#fff;
    -webkit-mask:url(/logo.png) left center/contain no-repeat;mask:url(/logo.png) left center/contain no-repeat}
  .acciones{display:flex;align-items:center;gap:8px}
  .usuario{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#dfe9f5;font-size:13px;font-weight:600}
  .usuario .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#06263a;font-size:12px;font-weight:700;text-transform:uppercase}
  .icono-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dfe9f5;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
  .icono-btn:hover{background:rgba(255,255,255,.14)}
  .icono-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icono-btn.salir:hover{background:#FF6B5B;border-color:#FF6B5B;color:#fff}
  .tema-claro,.tema-oscuro{display:none}
  [data-tema="claro"] .tema-oscuro{display:block}[data-tema="oscuro"] .tema-claro{display:block}

  /* Portada */
  .hero{position:relative;background:radial-gradient(1200px 400px at 85% -10%,rgba(79,201,238,.22),transparent 60%),linear-gradient(160deg,#0b1a33 0%,#10284d 100%);color:var(--hero-ink);overflow:hidden;padding-bottom:110px}
  [data-tema="oscuro"] .hero{background:radial-gradient(1200px 400px at 85% -10%,rgba(79,201,238,.16),transparent 60%),linear-gradient(160deg,#07101f 0%,#0d1d38 100%);border-bottom:1px solid var(--line)}
  .hero .hex{position:absolute;right:-60px;top:-40px;width:420px;height:420px;opacity:.10;pointer-events:none}
  .hero .hex path{fill:none;stroke:var(--cyan);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
  .hero-txt{position:relative;padding-top:48px}
  .saludo{margin:0 0 10px;color:var(--hero-sub);font-size:14px;font-weight:500}
  /* Nombre de la plataforma: "meja" + etiqueta "net" */
  .hero h1.marca{display:flex;align-items:center;margin:0;font-family:"Inter",system-ui,sans-serif;line-height:1}
  .marca .a{font-size:clamp(46px,6.4vw,64px);font-weight:900;letter-spacing:-2px;color:#fff;padding-right:7px;transform:translateY(-4px)}
  .marca .b{font-size:clamp(36px,5vw,50px);font-weight:700;letter-spacing:.5px;color:#06263a;background:var(--cyan);padding:6px 13px 10px;border-radius:13px}
  .marca small{font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--hero-sub);margin-left:14px;padding:3px 9px;border:1px solid rgba(255,255,255,.22);border-radius:999px}
  .hero p.lema{margin:12px 0 0;color:var(--hero-sub);font-size:15px}

  /* Módulos */
  main{flex:1;position:relative;z-index:1;margin-top:-80px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
  a.mod{--c:#1a64c8;position:relative;display:flex;align-items:center;gap:16px;padding:18px 18px 18px 18px;min-height:96px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;overflow:hidden;
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
  a.mod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.9}
  a.mod:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
  a.mod:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .tile{flex:0 0 56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;
    box-shadow:inset 0 -8px 14px rgba(0,0,0,.12),0 4px 10px color-mix(in srgb,var(--c) 35%,transparent)}
  .tile svg{width:36px;height:36px}
  .tile svg .h{fill:var(--c)} .tile svg .hs{stroke:var(--c)} .tile svg text{fill:var(--c)}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .nom{font-family:"Oswald","Arial Narrow",sans-serif;font-weight:500;font-size:20px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink);line-height:1.1}
  .des{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flecha{flex:0 0 20px;width:20px;height:20px;fill:none;stroke:var(--ink3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s,stroke .16s}
  a.mod:hover .flecha{transform:translateX(3px);stroke:var(--c)}
  a.mod.carga{--c:#ff6100}
  a.mod.bodega{--c:#875a86}
  a.mod.cotizador{--c:#1a64c8}
  a.mod.manzanillo{--c:#a8875c}
  a.mod.herramientas{--c:#89E900}
  a.mod.herramientas .tile{color:#222222}
  [data-tema="oscuro"] a.mod.bodega{--c:#a774a6}
  [data-tema="oscuro"] a.mod.cotizador{--c:#3b82e6}

  footer{padding:28px 0 24px;color:var(--ink3);font-size:12px}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* Escritorio: tarjetas verticales (ícono arriba) */
  @media (min-width:901px){
    a.mod{flex-direction:column;align-items:flex-start;gap:18px;min-height:208px;padding:22px 20px 20px}
    a.mod::before{left:0;right:0;top:0;bottom:auto;width:auto;height:4px}
    .tile{flex:0 0 auto;width:60px;height:60px}
    .tile svg{width:38px;height:38px}
    .info{gap:6px}
    .des{white-space:normal}
    .flecha{position:absolute;right:16px;top:20px}
  }
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:600px){
    .wrap{padding:0 16px}
    header .wrap{height:68px}.logo{width:164px;height:40px}
    .usuario .nombre{display:none}.usuario{padding:5px}
    .hero{padding-bottom:84px}.hero-txt{padding-top:20px}main{margin-top:-60px}.hero .hex{width:260px;height:260px;right:-70px}
    .grid{grid-template-columns:1fr;gap:12px}
    a.mod{min-height:80px;padding:14px}.tile{flex-basis:48px;height:48px;border-radius:12px}.tile svg{width:30px;height:30px}.nom{font-size:18px}
  }
</style>
</head>
<body>
<div class="hero">
  <svg class="hex" viewBox="0 0 200 200" aria-hidden="true"><path d="M100 14l74 42v88l-74 42-74-42V56z"/><path d="M62 78l38 24 38-24"/></svg>
  <header>
    <div class="wrap">
      <a href="/modulos" class="logo" aria-label="Grupo Meja"></a>
      <div class="acciones">
        <span class="usuario" id="usuario" hidden><span class="av" id="av"></span><span class="nombre" id="nombre"></span></span>
        <button class="icono-btn" id="tema" type="button" title="Cambiar tema" aria-label="Cambiar entre tema claro y oscuro">
          <svg class="tema-oscuro" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="tema-claro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="icono-btn salir" href="/logout" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
        </a>
      </div>
    </div>
  </header>
  <div class="wrap hero-txt">
    <p class="saludo" id="saludo">&nbsp;</p>
    <h1 class="marca"><span class="a">meja</span><span class="b">net</span><small>v1.0</small></h1>
    <p class="lema">Logística aduanal y transporte</p>
  </div>
</div>

<main>
  <div class="wrap">
    <nav class="grid" aria-label="Módulos">
      <a class="mod carga" href="/orden-de-carga">
        <span class="tile" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="11" y="8" width="42" height="54" rx="4" fill="currentColor"/><rect x="16" y="15" width="32" height="42" rx="1.5" class="h"/><path d="M24 5h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H24a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" class="h"/><path d="M25.5 7.5h13v4.5h-13z" fill="currentColor"/><g fill="currentColor"><rect x="20" y="20" width="11" height="2.6"/><rect x="38" y="20" width="6" height="2.6"/><rect x="22" y="25" width="22" height="2.6"/><rect x="20" y="30" width="24" height="2.6"/><rect x="20" y="35" width="12" height="2.6"/><rect x="20" y="39.5" width="15" height="2.6"/><rect x="20" y="44" width="13" height="2.6"/></g><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M37.5 36l1.8 2 3.4-4"/><path d="M37.5 40.5l1.8 2 3.4-4"/><path d="M37.5 45l1.8 2 3.4-4"/></g><circle cx="23.5" cy="52.5" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="23.5" cy="52.5" r="1.5" fill="currentColor"/></svg></span>
        <span class="info"><span class="nom">Orden de Carga</span><span class="des">Programación y estatus de carga</span></span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="mod bodega" href="/entradas-bodega">
        <span class="tile" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M2 30 L20 22 H62 V52 H2 Z" fill="currentColor"/><rect x="24" y="16" width="36" height="11" rx="1" class="h"/><rect x="25.5" y="17.5" width="33" height="8" fill="currentColor"/><text x="42" y="24" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="7" class="h" letter-spacing=".3">BODEGA</text><rect x="20" y="24" width="1.6" height="28" class="h"/><rect x="7" y="38" width="7" height="14" class="h"/><rect x="31" y="35" width="22" height="13" class="h"/><g fill="currentColor"><rect x="31" y="37.5" width="22" height="1.2"/><rect x="31" y="40.5" width="22" height="1.2"/><rect x="31" y="43.5" width="22" height="1.2"/></g><path d="M29 48h26v4H29z" class="h"/><path d="M30.5 49.5h23v2.5h-23z" fill="currentColor"/><rect x="1" y="52" width="62" height="2.5" fill="currentColor"/></svg></span>
        <span class="info"><span class="nom">Entradas Bodega</span><span class="des">Control de entradas a bodega</span></span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="mod cotizador" href="/cotizador">
        <span class="tile" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="13" y="5" width="38" height="54" rx="6" fill="currentColor"/><rect x="18" y="10" width="28" height="12" rx="2" class="h"/><rect x="34" y="14.5" width="9" height="3" rx="1.2" fill="currentColor"/><g class="h"><rect x="18" y="27" width="7" height="6" rx="1.5"/><rect x="28.5" y="27" width="7" height="6" rx="1.5"/><rect x="39" y="27" width="7" height="6" rx="1.5"/><rect x="18" y="36" width="7" height="6" rx="1.5"/><rect x="28.5" y="36" width="7" height="6" rx="1.5"/><rect x="39" y="36" width="7" height="15" rx="1.5"/><rect x="18" y="45" width="7" height="6" rx="1.5"/><rect x="28.5" y="45" width="7" height="6" rx="1.5"/></g><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M40.5 30h4M42.5 28v4"/><path d="M40.5 41.5h4M40.5 45.5h4"/><path d="M19.5 30h4"/></g></svg></span>
        <span class="info"><span class="nom">Cotizador</span><span class="des">Cotizaciones de servicios</span></span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="mod manzanillo" href="/op-manzanillo">
        <span class="tile" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="29" y="6" width="3" height="10" fill="currentColor"/><path d="M20 16h22v10H20z" fill="currentColor"/><g class="h"><rect x="23.5" y="19" width="4" height="3.5" rx=".6"/><rect x="29" y="19" width="4" height="3.5" rx=".6"/><rect x="34.5" y="19" width="4" height="3.5" rx=".6"/></g><path d="M14 26h34v6H14z" fill="currentColor"/><g class="h"><rect x="17" y="27.6" width="5" height="2.8"/><rect x="23.5" y="27.6" width="5" height="2.8"/><rect x="30" y="27.6" width="5" height="2.8"/><rect x="36.5" y="27.6" width="5" height="2.8"/></g><path d="M6 33h52l-7 14H13z" fill="currentColor"/><path d="M11 37h42" class="hs" stroke-width="1.6"/><path d="M3 52c4 0 4-2.6 8-2.6s4 2.6 8 2.6 4-2.6 8-2.6 4 2.6 8 2.6 4-2.6 8-2.6 4 2.6 8 2.6 4-2.6 8-2.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M9 58c4 0 4-2.4 8-2.4s4 2.4 8 2.4 4-2.4 8-2.4 4 2.4 8 2.4 4-2.4 8-2.4 4 2.4 7 2.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".6"/></svg></span>
        <span class="info"><span class="nom">OP Manzanillo</span><span class="des">Embarques en puerto<br>Control de Gastos</span></span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="mod herramientas" href="/herramientas">
        <span class="tile" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M44.5 6.5a13 13 0 0 0-12.3 17.2L8.6 47.3a5.6 5.6 0 0 0 0 7.9l.2.2a5.6 5.6 0 0 0 7.9 0l23.6-23.6A13 13 0 0 0 57.5 19.5l-7.6 7.6-8.1-1.5-1.5-8.1 7.6-7.6a13 13 0 0 0-3.4-3.4z" fill="currentColor"/><circle cx="12.7" cy="51.3" r="2.4" class="h"/><path d="M9 13l5-5 7 4 1.5 5.5 13 13-4 4-13-13L13 20z" fill="currentColor"/><path d="M37.5 37.5l4-4 14.8 14.8a4 4 0 0 1 0 5.7l-1.6 1.6a4 4 0 0 1-5.7 0z" fill="currentColor"/></svg></span>
        <span class="info"><span class="nom">Herramientas</span><span class="des">Reportes y utilidades</span></span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </nav>
  </div>
</main>

<footer><div class="wrap"><span>Grupo Meja · uso interno</span><span id="fecha"></span></div></footer>

<script>
  (function(){
    var raiz=document.documentElement;
    document.getElementById('tema').addEventListener('click',function(){
      var t=raiz.dataset.tema==='oscuro'?'claro':'oscuro';raiz.dataset.tema=t;
      try{localStorage.setItem('mejanet-tema',t)}catch(e){}
    });
    var h=new Date().getHours();
    var saludo=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
    var fecha=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    document.getElementById('saludo').textContent=saludo;
    document.getElementById('fecha').textContent=fecha.charAt(0).toUpperCase()+fecha.slice(1);
    fetch('/api/sesion',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null}).then(function(s){
      if(!s||!s.usuario)return;
      document.getElementById('saludo').textContent=saludo+', '+s.usuario;
      document.getElementById('nombre').textContent=s.usuario;
      document.getElementById('av').textContent=s.usuario.charAt(0);
      document.getElementById('usuario').hidden=false;
    }).catch(function(){});
  })();
</script>
<script src="/solo-lectura.js"></script>
</body>
</html>
