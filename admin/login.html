<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/iconos/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest?v=2">
<meta name="theme-color" content="#0b1a33">
<meta name="apple-mobile-web-app-title" content="mejanet">
<title>mejanet v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script>
  // Mismo tema que eligió el usuario en Módulos (o el del sistema)
  (function(){var t=null;try{t=localStorage.getItem('mejanet-tema')}catch(e){}
   if(t!=='claro'&&t!=='oscuro')t=matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro';
   document.documentElement.dataset.tema=t})();
</script>
<style>
  :root{--cyan:#4fc9ee;--sub:#a9c3dd;--card:#ffffff;--ink:#0b1a33;--ink2:#56627a;--line:#d6dee9;--campo:#f6f8fb;--sombra:0 20px 50px rgba(3,10,25,.35)}
  [data-tema="oscuro"]{--card:#121c31;--ink:#e8eef8;--ink2:#a3b0c6;--line:#26344f;--campo:#0e1729;--sombra:0 20px 50px rgba(0,0,0,.5)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;position:relative;overflow-x:hidden;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;
    background:radial-gradient(900px 420px at 85% -10%,rgba(79,201,238,.22),transparent 60%),linear-gradient(160deg,#0b1a33 0%,#10284d 100%)}
  [data-tema="oscuro"] body{background:radial-gradient(900px 420px at 85% -10%,rgba(79,201,238,.16),transparent 60%),linear-gradient(160deg,#07101f 0%,#0d1d38 100%)}
  /* Marca de agua: cubo del logo grupomeja */
  .hex{position:fixed;right:-60px;bottom:-60px;width:420px;height:455px;opacity:.08;pointer-events:none;background:var(--cyan);
    -webkit-mask:url(/iconos/cubo-blanco.png) center/contain no-repeat;mask:url(/iconos/cubo-blanco.png) center/contain no-repeat}
  main{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
  .logo{display:block;width:204px;height:50px;background:#fff;margin-bottom:34px;
    -webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat}
  h1.marca{display:flex;align-items:center;margin:0;line-height:1}
  .marca .a{font-size:56px;font-weight:900;letter-spacing:-2px;color:#fff;padding-right:7px;transform:translateY(-4px)}
  .marca .b{font-size:44px;font-weight:700;letter-spacing:.5px;color:#06263a;background:var(--cyan);padding:5px 12px 9px;border-radius:12px}
  .marca small{font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--sub);margin-left:12px;padding:3px 8px;border:1px solid rgba(255,255,255,.22);border-radius:999px}
  .lema{margin:12px 0 30px;color:var(--sub);font-size:14px;font-weight:700;letter-spacing:.2px}
  form{width:100%;display:grid;gap:16px;padding:28px 26px 26px;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:var(--sombra);border:1px solid var(--line)}
  form h2{margin:0 0 2px;font-size:18px;font-weight:700}
  form p.ayuda{margin:-10px 0 4px;font-size:13px;color:var(--ink2)}
  label{display:grid;gap:7px;font-size:13px;font-weight:600;color:var(--ink2)}
  .campo{position:relative}
  .campo svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--ink2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  input{width:100%;height:50px;padding:0 14px 0 44px;font:inherit;font-size:16px;color:var(--ink);background:var(--campo);
    border:1.5px solid var(--line);border-radius:12px;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(79,201,238,.25)}
  button{margin-top:4px;height:52px;border:0;border-radius:12px;cursor:pointer;background:var(--cyan);color:#06263a;
    font:inherit;font-size:16px;font-weight:800;letter-spacing:.3px;box-shadow:0 8px 20px rgba(79,201,238,.30);transition:filter .15s,transform .08s}
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  button:disabled{opacity:.7;cursor:wait}
  .error{min-height:18px;margin:0;color:#e5484d;font-size:14px;font-weight:600;text-align:center}
  [data-tema="oscuro"] .error{color:#ff7b74}
  footer{position:relative;margin-top:26px;font-size:12px;color:var(--sub);opacity:.8}
  @media (max-width:420px){.logo{width:170px;height:42px;margin-bottom:26px}.marca .a{font-size:48px}.marca .b{font-size:38px}form{padding:24px 20px 20px}}
</style>
</head>
<body>
<div class="hex" aria-hidden="true"></div>
<main>
  <div class="logo" role="img" aria-label="Grupo Meja"></div>
  <h1 class="marca"><span class="a">meja</span><span class="b">net</span><small>v1.0</small></h1>
  <p class="lema">Logística aduanal y transporte</p>
  <form id="f" method="post" action="/api/login" autocomplete="on">
    <h2>Iniciar sesión</h2>
    <label>Usuario
      <span class="campo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <input name="usuario" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required></span>
    </label>
    <label>Contraseña
      <span class="campo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input name="clave" id="clave" type="password" autocomplete="current-password" required></span>
    </label>
    <p class="error" id="error" role="alert"></p>
    <button type="submit" id="entrar">Entrar</button>
  </form>
  <footer>Grupo Meja · uso interno</footer>
</main>
<script>
  const f = document.getElementById('f'), err = document.getElementById('error'), btn = document.getElementById('entrar');
  const destino = (() => {
    const n = new URLSearchParams(location.search).get('next') || '/modulos';
    return /^\/(?!\/)/.test(n) ? n : '/modulos';
  })();
  document.getElementById('usuario').focus();
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: f.usuario.value.trim(), clave: f.clave.value }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) { location.replace(destino); return; }
      err.textContent = j.error || 'No se pudo iniciar sesión.';
      f.clave.value = '';
      f.clave.focus();
    } catch {
      err.textContent = 'Sin conexión con el servidor. Intenta de nuevo.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
