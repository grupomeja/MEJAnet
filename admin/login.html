<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEJAnet v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f8fb;--ink:#0b1a33;--accent:#1f4e8c;--accent-osc:#123a6b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:520px;padding:32px 20px;text-align:center}
  img{width:min(300px,70%);height:auto;display:block;margin:0 auto 44px}
  h1{margin:0 0 48px;font-size:clamp(34px,9vw,52px);letter-spacing:1px;font-weight:800}
  h1 span{color:#4fc9ee}
  h1 small{font-size:.38em;font-weight:700;color:#5d6672;letter-spacing:.5px;margin-left:6px}
  form{display:grid;gap:16px;max-width:380px;margin:0 auto;text-align:left}
  label{display:grid;gap:6px;font-size:14px;font-weight:700;color:#3b4654;letter-spacing:.3px}
  input{width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:var(--ink);background:#fff;
    border:1.5px solid #c9d4e0;border-radius:10px;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,201,238,.35)}
  button{margin-top:8px;height:60px;border:0;border-radius:10px;cursor:pointer;color:#fff;background:var(--accent);
    font-family:"Oswald","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:22px;letter-spacing:1.5px;text-transform:uppercase;
    box-shadow:0 4px 0 var(--accent-osc),0 10px 22px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,filter .15s}
  button:hover{filter:brightness(1.07)}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-osc),0 4px 10px rgba(0,0,0,.18)}
  button:focus-visible{outline:3px solid #4fc9ee;outline-offset:3px}
  button:disabled{opacity:.7;cursor:wait}
  .error{min-height:20px;margin:0;color:#c0262d;font-size:15px;font-weight:600;text-align:center}
</style>
</head>
<body>
<main>
  <img src="/mejanet-logo.png" alt="Grupo Meja">
  <h1>MEJA<span>net</span><small>v1.0</small></h1>
  <form id="f" method="post" action="/api/login" autocomplete="on">
    <label>Usuario
      <input name="usuario" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label>Contraseña
      <input name="clave" id="clave" type="password" autocomplete="current-password" required>
    </label>
    <p class="error" id="error" role="alert"></p>
    <button type="submit" id="entrar">Entrar</button>
  </form>
</main>
<script>
  const f = document.getElementById('f'), err = document.getElementById('error'), btn = document.getElementById('entrar');
  const destino = (() => {
    const n = new URLSearchParams(location.search).get('next') || '/modulos';
    return /^\/(?!\/)/.test(n) ? n : '/modulos';
  })();
  document.getElementById('usuario').focus();
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: f.usuario.value.trim(), clave: f.clave.value }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) { location.replace(destino); return; }
      err.textContent = j.error || 'No se pudo iniciar sesión.';
      f.clave.value = '';
      f.clave.focus();
    } catch {
      err.textContent = 'Sin conexión con el servidor. Intenta de nuevo.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
