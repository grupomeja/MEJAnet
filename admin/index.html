<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABLERO DE ORDENES DE CARGA</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#15181d;--muted:#5d6672;--line:#d5d9df;--accent:#1f4e8c;--accent-ink:#fff;--ok:#17794a;--warn:#a15c00;--err:#b3261e;--soft:#eef2f8}
  @media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--ink:#eef0f3;--muted:#a2abb7;--line:#363c45;--accent:#6aa3ec;--accent-ink:#0b1626;--ok:#52c28a;--warn:#f0b35a;--err:#ff8a80;--soft:#232a33}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:0}
  .logo img{height:40px;width:auto;display:block}
  .top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 16px;align-items:center;margin:0 0 14px}
  .top h1{text-align:center;font-size:20px}
  .top .acc{justify-content:flex-end}
  @media (max-width:760px){.top{grid-template-columns:1fr;justify-items:center}.top .acc{justify-content:center;flex-wrap:wrap}.top h1{font-size:19px}}
  .acc{display:flex;gap:8px}
  .acc a{white-space:nowrap}
  .acc a{text-decoration:none;font-weight:700;border-radius:10px;padding:9px 12px;font-size:14px}
  .acc .nuevo{background:var(--accent);color:var(--accent-ink)}
  .acc .inicio{border:1px solid var(--line);color:var(--accent);background:var(--card)}
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
  .kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .filters{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr 1fr auto;margin-bottom:12px;align-items:end}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
  input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center}
  .tabs button{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .tabs .sp{flex:1}
  .count{color:var(--muted);font-size:13px;margin:0 0 8px}
  details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  summary{cursor:pointer;padding:12px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center;list-style:none}
  summary::-webkit-details-marker{display:none}
  .oc{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .meta{color:var(--muted);font-size:13px}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--soft);white-space:nowrap}
  .pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.err{color:var(--err)}
  .tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;background:var(--soft)}
  td.c,th.c{text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  a.btn{color:var(--accent);font-weight:700;text-decoration:none;padding:0 14px 12px;display:inline-block}
  .pill.rojo{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
  button.chip{border:1px solid transparent;cursor:pointer;font:inherit;font-size:12px;font-weight:700;padding:3px 10px;color:var(--ink)}
  button.chip:hover{outline:2px solid var(--accent)}
  .pill.amb{color:var(--warn)}
  .pill.verde{background:var(--ok);color:#fff}
  a.btn.dis{color:var(--muted);pointer-events:none;font-weight:600}
  .aviso{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px;display:none}
  .vacio{padding:30px;text-align:center;color:var(--muted)}
  @media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="logo" href="/" aria-label="MEJAnet"><img src="/logo.png" alt="Grupo Meja"></a>
    <h1>TABLERO DE ORDENES DE CARGA</h1>
    <div class="acc"><a class="nuevo" href="/nueva-orden">+ Crear Nueva Orden de Carga</a><a class="inicio" href="/">MEJAnet</a></div>
  </div>

  <div class="aviso" id="aviso"></div>
  <section class="kpis">
    <div class="kpi"><b id="k1">–</b><span>Órdenes</span></div>
    <div class="kpi"><b id="k2">–</b><span>Tráficos</span></div>
    <div class="kpi"><b id="k3" style="color:var(--err)">–</b><span>Sin cargar</span></div>
    <div class="kpi"><b id="k4" style="color:var(--ok)">–</b><span>Traficos Cargados</span></div>
  </section>

  <section class="filters">
    <div class="q"><label for="q">Buscar</label><input id="q" type="search" placeholder="OC, cliente, placas, sello, tráfico, pedimento, nota…"></div>
    <div><label for="est">Estado</label>
      <select id="est"><option value="">Todos</option><option value="nosep">Falta separar</option><option value="sep">Separado, falta cargar</option><option value="car">Cargado</option><option value="pend">Sin cargar (todos)</option><option value="noscan">Sin escaneo terminado</option></select></div>
    <div><label for="d1">Cruce desde</label><input id="d1" type="date"></div>
    <div><label for="d2">Cruce hasta</label><input id="d2" type="date"></div>
    <button class="sec" id="limpia" type="button">Limpiar</button>
  </section>

  <div class="tabs">
    <button id="tOrd" class="on" type="button">Por orden</button>
    <button id="tTra" type="button">Por tráfico</button>
    <span class="sp"></span>
    <button id="csv" class="sec" type="button">Descargar Excel (CSV)</button>
  </div>
  <p class="count" id="count"></p>
  <div id="lista">Cargando…</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const oc4 = (n) => String(n).padStart(4, '0');
let ordenes = [], vista = 'orden';
const abiertas = new Set();

function fechaCruce(s) { // dd/mm/yyyy -> Date | null
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s || '');
  return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null;
}
const tieneDatos = (f) => f.trafico || f.bultos || f.pedimento || f.nota;
const tieneTrafico = (f) => !!String(f.trafico || '').trim();
let terminadas = {};   // oc (4 dígitos) -> archivo más reciente revisado

// Estado de un renglón (f._i = posición en la orden). Solo cuenta si hay TRAFICO.
// Cada campo: v = true/false/undefined(sin dato), man = cambiado a mano, ver = verificado (manual o escaneo claro).
function est(o, f) {
  if (!tieneTrafico(f)) return { t: false };
  const sc = terminadas[oc4(o.oc)], n = f._i + 1;
  const m = (o.manual || {})[String(n)] || {};
  const r = sc && (sc.filas || []).find((x) => x.n === n);
  const campo = (c) => {
    if (typeof m[c] === 'boolean') return { v: m[c], man: true, ver: true };
    if (sc) return { v: !!(r && r[c]), man: false, ver: !sc.revisar };
    return { v: undefined, man: false, ver: false };
  };
  return { t: true, scan: !!sc, sep: campo('separado'), car: campo('cargado') };
}
function chip(o, f, c, e) {
  const x = e[c], et = c === 'sep' ? 'Separado' : 'Cargado', nombre = c === 'sep' ? 'separado' : 'cargado';
  const cls = x.v === undefined ? '' : x.v ? 'ok' : 'rojo';
  const txt = x.v === undefined ? et + ': —' : x.v ? '✓ ' + et : '✗ No ' + et.toLowerCase();
  const nota = x.man ? ' ✎' : (!x.ver && x.v !== undefined ? ' ?' : '');
  return `<button type="button" class="pill chip ${cls}" data-id="${o.id}" data-n="${f._i + 1}" data-c="${nombre}" data-v="${x.v === undefined ? '' : x.v}" title="Clic para cambiar a mano${x.man ? ' (✎ = cambiado a mano)' : ''}">${txt}${nota}</button>`;
}
function pillEstado(o, f) {
  const e = est(o, f);
  if (!e.t) return '<span class="meta">—</span>';
  const hayManual = !!(o.manual || {})[String(f._i + 1)];
  return chip(o, f, 'sep', e) + ' ' + chip(o, f, 'car', e) +
    (hayManual ? ` <button type="button" class="pill chip quita" data-id="${o.id}" data-n="${f._i + 1}" title="Quitar cambios manuales y volver a lo que dice el escaneo">↺</button>` : '');
}
const txtV = (x, si, no) => x.v === undefined ? 'SIN DATO' : x.v ? si : no;
function textoEstado(o, f) {
  const e = est(o, f);
  if (!e.t) return '';
  return `${txtV(e.sep, 'SEPARADO', 'NO SEPARADO')} / ${txtV(e.car, 'CARGADO', 'NO CARGADO')}`;
}
function cumple(o, f, s) {
  const e = est(o, f);
  if (!e.t) return false;
  if (s === 'noscan') return e.sep.v === undefined || e.car.v === undefined;
  if (s === 'pend') return e.car.v !== true;
  if (s === 'nosep') return e.sep.v === false;
  if (s === 'sep') return e.sep.v === true && e.car.v !== true;
  return e.car.v === true;
}
// Resumen de una orden a partir de sus renglones con tráfico
function resumenOrden(o) {
  const filas = (o.datos.filas || []).map((f, i) => ({ ...f, _i: i })).filter(tieneTrafico);
  const es = filas.map((f) => est(o, f));
  const nSep = es.filter((e) => e.sep.v === false).length, nCar = es.filter((e) => e.car.v === false).length;
  const nDato = es.filter((e) => e.sep.v === undefined || e.car.v === undefined).length;
  const todoSi = es.length > 0 && es.every((e) => e.sep.v === true && e.car.v === true);
  const verificado = es.every((e) => e.sep.ver && e.car.ver);
  return { n: es.length, nSep, nCar, nDato, completa: todoSi && verificado, porVerificar: todoSi && !verificado };
}

// Filtro: devuelve órdenes con sus renglones ya filtrados
function filtrar() {
  const q = $('q').value.trim().toLowerCase(), s = $('est').value;
  const d1 = $('d1').value ? new Date($('d1').value + 'T00:00:00') : null;
  const d2 = $('d2').value ? new Date($('d2').value + 'T00:00:00') : null;
  const out = [];
  for (const o of ordenes) {
    const d = o.datos, fc = fechaCruce(d.fecha);
    if ((d1 || d2) && (!fc || (d1 && fc < d1) || (d2 && fc > d2))) continue;
    const cab = [oc4(o.oc), d.cliente, d.caja, d.sello, d.fecha, d.capturista].join(' ').toLowerCase();
    const cabOK = !q || cab.includes(q);
    let filas = (d.filas || []).map((f, i) => ({ ...f, _i: i })).filter(tieneDatos);
    if (s) filas = filas.filter((f) => cumple(o, f, s));
    if (q && !cabOK) filas = filas.filter((f) => [f.trafico, f.bultos, f.pedimento, f.nota].join(' ').toLowerCase().includes(q));
    if ((s || (q && !cabOK)) && !filas.length) continue;
    out.push({ o, filas });
  }
  return out;
}

const linkDrive = (id) => `https://drive.google.com/file/d/${id}/view`;

function pinta() {
  const r = filtrar();
  const nTra = r.reduce((a, x) => a + x.filas.length, 0);
  $('count').textContent = vista === 'orden' ? `${r.length} orden(es)` : `${nTra} renglón(es) en ${r.length} orden(es)`;
  if (!r.length) { $('lista').innerHTML = '<div class="vacio">No hay resultados.</div>'; return; }
  if (vista === 'orden') {
    $('lista').innerHTML = r.map(({ o, filas }) => {
      const d = o.datos, sc = terminadas[oc4(o.oc)];
      const rs = resumenOrden(o);
      let resumen = `<span class="pill">${rs.n} tráfico(s)</span> `;
      if (rs.completa) resumen += '<span class="pill verde">Carga Completada</span>';
      else {
        if (rs.nSep) resumen += `<span class="pill rojo">${rs.nSep} sin separar</span> `;
        if (rs.nCar) resumen += `<span class="pill rojo">${rs.nCar} sin cargar</span> `;
        if (rs.porVerificar) resumen += '<span class="pill amb">Por verificar</span> ';
        if (rs.nDato) resumen += `<span class="pill">${rs.nDato} sin revisar</span>`;
      }
      return `<details data-oid="${o.id}"${abiertas.has(o.id) ? ' open' : ''}><summary>
        <div><span class="oc">OC # ${oc4(o.oc)}</span> · <b>${esc(d.cliente) || 'Sin cliente'}</b>
          <div class="meta">Cruce: ${esc(d.fecha) || 'PENDIENTE'} · Caja/Placas: ${esc(d.caja)} · Sello: ${esc(d.sello)}${d.capturista ? ' · ' + esc(d.capturista) : ''}<br>Recibida: ${new Date(o.creada).toLocaleString('es-MX')}</div></div>
        <div style="text-align:right">${resumen}</div></summary>
        <div class="tablewrap"><table><thead><tr><th>Tráfico</th><th>Bultos</th><th>Pedimento</th><th>Nota</th><th class="c">Estado</th></tr></thead><tbody>
        ${filas.map((f) => `<tr><td>${esc(f.trafico)}</td><td>${esc(f.bultos)}</td><td>${esc(f.pedimento)}</td><td>${esc(f.nota)}</td><td class="c">${pillEstado(o, f)}</td></tr>`).join('') || '<tr><td colspan="5" class="meta">Sin renglones</td></tr>'}
        </tbody></table></div>
        ${sc && sc.revisar ? `<div class="aviso" style="display:block;margin:8px 14px">La lectura de este escaneo quedó dudosa: ${esc(sc.nota) || 'revísalo a mano'}.</div>` : ''}
        <a class="btn" target="_blank" href="/api/admin/ordenes/${o.id}/pdf">Ver PDF</a>
        ${sc ? `<a class="btn" target="_blank" rel="noopener" href="${linkDrive(sc.fileId)}">Ver PDF Terminado</a>` : '<a class="btn dis">Ver PDF Terminado (aún no hay)</a>'}</details>`;
    }).join('');
  } else {
    const filas = r.flatMap(({ o, filas }) => filas.map((f) => ({ o, f })));
    $('lista').innerHTML = `<div class="card tablewrap" style="border-top:0"><table><thead><tr><th>OC #</th><th>Cliente</th><th>Cruce</th><th>Tráfico</th><th>Bultos</th><th>Pedimento</th><th>Nota</th><th class="c">Estado</th></tr></thead><tbody>
      ${filas.map(({ o, f }) => `<tr><td><a class="oc" target="_blank" style="text-decoration:none" href="/api/admin/ordenes/${o.id}/pdf">${oc4(o.oc)}</a></td><td>${esc(o.datos.cliente)}</td><td>${esc(o.datos.fecha) || 'PENDIENTE'}</td><td>${esc(f.trafico)}</td><td>${esc(f.bultos)}</td><td>${esc(f.pedimento)}</td><td>${esc(f.nota)}</td><td class="c">${pillEstado(o, f)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
}

function kpis() {
  const tr = ordenes.flatMap((o) => (o.datos.filas || []).map((f, i) => ({ o, f: { ...f, _i: i } }))).filter(({ f }) => tieneTrafico(f));
  const es = tr.map(({ o, f }) => est(o, f));
  $('k1').textContent = ordenes.length;
  $('k2').textContent = tr.length;
  $('k3').textContent = es.filter((e) => e.car.v !== true).length;
  $('k4').textContent = es.filter((e) => e.car.v === true).length;
}

// Suma todas las cantidades escritas en BULTOS ("1 ATADO 2 CAJAS DE MADERA" -> 3). Sin números, se deja el texto.
function totalBultos(txt) {
  const nums = String(txt ?? '').match(/\d+(?:\.\d+)?/g);
  if (!nums) return String(txt ?? '');
  const s = nums.reduce((t, n) => t + Number(n), 0);
  return String(Math.round(s * 100) / 100);
}

function csv() {
  const filas = filtrar().flatMap(({ o, filas }) => (filas.length ? filas : [{}]).map((f) => [
    oc4(o.oc), o.datos.cliente, o.datos.fecha || 'PENDIENTE', o.datos.caja, o.datos.sello,
    f.trafico, totalBultos(f.bultos), f.bultos, f.pedimento, f.nota, textoEstado(o, f),
    o.datos.capturista, new Date(o.creada).toLocaleString('es-MX')]));
  const enc = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const txt = [['OC', 'Cliente', 'Fecha de cruce', 'Caja/Placas', 'Sello', 'Trafico', 'Bultos', 'Detalle de bultos', 'Pedimento', 'Nota', 'Estado', 'Capturo', 'Recibida'], ...filas]
    .map((r) => r.map(enc).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ordenes_de_carga.csv'; a.click();
}

$('lista').addEventListener('toggle', (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.oid) return;
  const id = Number(d.dataset.oid); d.open ? abiertas.add(id) : abiertas.delete(id);
}, true);

async function guardaManual(id, n, campo, valor) {
  const r = await fetch(`/api/admin/ordenes/${id}/estado`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n, campo, valor }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || 'No se pudo guardar');
  const o = ordenes.find((x) => x.id === id); if (o) o.manual = j.manual;
}
$('lista').addEventListener('click', async (e) => {
  const b = e.target.closest('button.chip'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const id = Number(b.dataset.id), n = Number(b.dataset.n);
  b.disabled = true;
  try {
    if (b.classList.contains('quita')) { await guardaManual(id, n, 'separado', null); await guardaManual(id, n, 'cargado', null); }
    else await guardaManual(id, n, b.dataset.c, b.dataset.v === '' ? true : b.dataset.v !== 'true');
    kpis(); pinta();
  } catch (err) { b.disabled = false; alert('No se pudo guardar el cambio: ' + err.message); }
});

['q', 'est', 'd1', 'd2'].forEach((id) => $(id).addEventListener('input', pinta));
$('limpia').onclick = () => { ['q', 'est', 'd1', 'd2'].forEach((id) => ($(id).value = '')); pinta(); };
$('tOrd').onclick = () => { vista = 'orden'; $('tOrd').classList.add('on'); $('tTra').classList.remove('on'); pinta(); };
$('tTra').onclick = () => { vista = 'trafico'; $('tTra').classList.add('on'); $('tOrd').classList.remove('on'); pinta(); };
$('csv').onclick = csv;

function indexaTerminadas(j) {
  terminadas = {};
  for (const a of (j.archivos || [])) {
    if (!a.oc) continue;
    const k = String(a.oc).padStart(4, '0');
    if (!terminadas[k] || String(a.modificado) > String(terminadas[k].modificado)) terminadas[k] = a; // gana el escaneo más reciente
  }
  if (j.error) { $('aviso').style.display = 'block'; $('aviso').textContent = 'No se pudo leer la carpeta OC_TERMINADAS (' + j.error + '). Se muestran las órdenes sin estado de escaneo.'; }
  else if (j.aviso) { $('aviso').style.display = 'block'; $('aviso').textContent = j.aviso; }
}
Promise.all([
  fetch('/api/admin/ordenes').then((r) => r.json()),
  fetch('/api/admin/terminadas').then((r) => r.json()).catch(() => ({ archivos: [], error: 'sin respuesta' })),
]).then(([o, t]) => { ordenes = o; indexaTerminadas(t); kpis(); pinta(); })
  .catch(() => { $('lista').innerHTML = '<div class="vacio">No se pudieron cargar las órdenes.</div>'; });
</script>
</body>
</html>
