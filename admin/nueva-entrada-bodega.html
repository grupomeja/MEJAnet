<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agregar Entrada Bodega</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#15181d;--muted:#5d6672;--line:#d5d9df;--accent:#1f4e8c;--accent-ink:#fff;--ok:#17794a;--err:#b3261e;--azul:#1a64c8;--nar:#d95a00}
  @media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--ink:#eef0f3;--muted:#a2abb7;--line:#363c45;--accent:#6aa3ec;--accent-ink:#0b1626;--ok:#52c28a;--err:#ff8a80;--azul:#6aa3ec;--nar:#ff9a4d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:820px;margin:0 auto;padding:16px}
  .logo img{height:40px;width:auto;display:block}
  .top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 16px;align-items:center;margin:0 0 14px}
  .top h1{margin:0;text-align:center;font-size:20px}
  .acc{display:flex;justify-content:flex-end}
  .acc a{white-space:nowrap;text-decoration:none;font-weight:700;border-radius:10px;padding:9px 12px;font-size:14px;border:1px solid var(--line);color:var(--accent);background:var(--card)}
  @media (max-width:760px){.top{grid-template-columns:1fr;justify-items:center}.acc{justify-content:center}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  .full{grid-column:1/-1}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .ref{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);max-width:260px}
  .ref:focus-within{outline:2px solid var(--accent);outline-offset:1px}
  .ref span{padding:0 4px 0 12px;font-weight:800;color:var(--accent)}
  .ref input{border:0;outline:0;background:transparent;font-weight:800;padding-left:4px;text-transform:uppercase}
  select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  #descOtro{margin-top:8px}
  textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;min-height:90px}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .refrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .refrow .ref{width:180px}
  #fecha{width:180px;max-width:100%}
  .derecha{display:flex;flex-direction:column;align-items:flex-end}
  .tipo{display:inline-flex;margin:0;cursor:pointer;text-transform:none;letter-spacing:0}
  .tipo input{position:absolute;opacity:0;width:1px;height:1px}
  .tipo span{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;color:var(--muted);background:var(--bg)}
  .tipo input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  .tipo span{opacity:.28;transition:opacity .15s}
  .tipo:hover span{opacity:.55}
  .tipo input:checked+span{opacity:1;border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
  .tipo.hz input:checked+span{border-color:var(--err);color:var(--err);background:color-mix(in srgb,var(--err) 13%,transparent)}
  .refrow .tipo+.tipo{margin-left:-6px}
  /* Recordatorio HAZMAT */
  .aviso-fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .aviso-caja{background:var(--card,#fff);color:var(--ink);border-radius:14px;max-width:440px;width:100%;padding:22px 22px 18px;border-top:6px solid var(--err);box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
  .aviso-caja .tit{font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--err);margin:0 0 8px}
  .aviso-caja .ref{font-size:13px;color:var(--muted);margin:0 0 12px}
  .aviso-caja .txt{font-size:18px;font-weight:800;line-height:1.35;margin:0 0 18px}
  .aviso-caja button{background:var(--err);color:#fff;border:0;border-radius:10px;padding:11px 28px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;width:auto}

  .peso{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
  .peso .eq{padding-bottom:12px;color:var(--muted);font-weight:700}
  .ayuda{color:var(--muted);font-size:13px;margin:6px 0 0}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%;font-size:18px}
  button:disabled{opacity:.6}
  .msg{margin-top:12px;padding:14px;border-radius:10px;font-weight:600;display:none}
  .msg.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .msg.err{display:block;background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
  .msg a{color:inherit}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}
  /* Sugerencias de Cliente / Proveedor: la primera queda marcada y ENTER la escribe */
  .sug{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:3px;background:var(--card,#fff);border:1px solid #c9d3e0;border-radius:10px;
    box-shadow:0 8px 22px rgba(0,0,0,.12);padding:4px;max-height:240px;overflow:auto}
  .sug div{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sug div.act{background:#1f4e8c;color:#fff}
  .sug div:not(.act):hover{background:#eef2f8}
  .sug b{font-weight:800}
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="logo"><img src="/logo.png" alt="Grupo Meja"></span>
    <h1>AGREGAR ENTRADA BODEGA</h1>
    <div class="acc"><a href="/entradas-bodega">← Volver al tablero</a></div>
  </div>

  <form id="f" autocomplete="off">
    <section class="card grid">
      <!-- Izquierda: Referencia, Proveedor, Bultos, Peso (Lbs), Linea fletera, P.O. | Derecha: Fecha, Cliente, Descripcion, Peso (KGS), Tracking, Pedimento -->
      <div><label for="referencia">Referencia</label>
        <div class="refrow">
          <div class="ref"><span>MEJA</span><input type="text" id="referencia" placeholder="####/###" maxlength="8" required></div>
          <label class="tipo" title="Marca si la entrada es in-bond"><input type="checkbox" id="inbond"><span>in-bond</span></label>
          <label class="tipo hz" title="Marca si la entrada es haz-mat (material peligroso)"><input type="checkbox" id="hazmat"><span>haz-mat</span></label>
        </div></div>
      <div class="derecha"><label for="fecha">Fecha arribo</label><input type="date" id="fecha"></div>
      <div><label for="proveedor">Proveedor</label><input type="text" id="proveedor" maxlength="120" autocomplete="off"></div>
      <div><label for="cliente">Cliente</label><input type="text" id="cliente" maxlength="120" autocomplete="off"></div>
      <div><label for="bultos">Bultos</label><input type="text" id="bultos" inputmode="numeric" maxlength="120"></div>
      <div><label for="descripcion">Descripcion</label>
        <select id="descripcion">
          <option value="">Selecciona…</option><option>ATADO(S)</option><option>CARTON/ES</option><option>BULTOS</option><option>CAJA(S)</option>
          <option>CAJA(S) DE MADERA</option><option>BOLSAS</option><option>SACOS</option><option value="__otro">OTRO</option>
        </select>
        <input type="text" id="descOtro" maxlength="120" placeholder="Escribe la descripción" hidden></div>
      <div class="full">
        <div class="peso">
          <div><label for="peso_lbs">Peso (Lbs)</label><input type="text" id="peso_lbs" inputmode="decimal" maxlength="20" placeholder="Libras"></div>
          <span class="eq">=</span>
          <div><label for="peso_kgs">Peso (KGS)</label><input type="text" id="peso_kgs" inputmode="decimal" maxlength="20" placeholder="Kilogramos"></div>
        </div>
        <p class="ayuda">Escribe el peso en libras o en kilogramos; el otro se calcula solo.</p>
      </div>
      <div><label for="linea">Linea fletera</label><input type="text" id="linea" maxlength="120" autocomplete="off"></div>
      <div><label for="tracking">Tracking #</label><input type="text" id="tracking" maxlength="120"></div>
      <div><label for="po">P.O.</label><input type="text" id="po" maxlength="120"></div>
      <div><label for="pedimento">Pedimento</label><input type="text" id="pedimento" maxlength="120"></div>
      <div class="full"><label for="notas">Notas</label><textarea id="notas" maxlength="500" placeholder="Observaciones de esta entrada"></textarea></div>
    </section>
    

    <button id="guardar" type="submit">Guardar registro</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CAMPOS = ['fecha', 'cliente', 'bultos', 'descripcion', 'peso_lbs', 'peso_kgs', 'linea', 'tracking', 'po', 'proveedor', 'pedimento'];
const LB_POR_KG = 2.20462;

// --- Conversión de peso: lo que escribas en uno calcula el otro ---
const leeNum = (s) => { const n = parseFloat(String(s).replace(/,/g, '').trim()); return Number.isFinite(n) && n >= 0 ? n : null; };
const redondea = (n) => String(Math.round(n * 10) / 10);
$('peso_lbs').addEventListener('input', () => { const n = leeNum($('peso_lbs').value); $('peso_kgs').value = n === null ? '' : redondea(n / LB_POR_KG); });
$('peso_kgs').addEventListener('input', () => { const n = leeNum($('peso_kgs').value); $('peso_lbs').value = n === null ? '' : redondea(n * LB_POR_KG); });

function hoy() {
  const h = new Date(), p = (x) => String(x).padStart(2, '0');
  return `${h.getFullYear()}-${p(h.getMonth() + 1)}-${p(h.getDate())}`;
}
// DESCRIPCION: con OTRO aparece un campo para escribirla
$('descripcion').addEventListener('change', () => {
  const otro = $('descripcion').value === '__otro';
  $('descOtro').hidden = !otro; if (otro) $('descOtro').focus();
});
// Sugerencias con lo que ya existe en el tablero
fetch('/api/admin/entradas-bodega').then((r) => r.json()).then((lista) => {
  const unicos = (campo) => {
    const m = new Map();
    for (const e of lista) { const v = (e.datos[campo] || '').trim(); if (v && !m.has(v.toUpperCase())) m.set(v.toUpperCase(), v); }
    return [...m.values()].sort((a, b) => a.localeCompare(b, 'es'));
  };
  sugerencias($('cliente'), unicos('cliente'));
  sugerencias($('proveedor'), unicos('proveedor'));
  sugerencias($('linea'), unicos('linea'));
}).catch(() => {});

// Lista de sugerencias propia: muestra coincidencias (primero las que empiezan con lo escrito),
// la primera queda marcada; flechas para moverse, ENTER o clic la escribe, ESC cierra.
function sugerencias(input, valores) {
  const caja = document.createElement('div'); caja.className = 'sug'; caja.hidden = true;
  input.parentElement.style.position = 'relative'; input.parentElement.appendChild(caja);
  let items = [], act = 0;
  const pinta = () => {
    caja.innerHTML = items.map((v, i) => {
      const q = input.value.trim(), k = v.toUpperCase().indexOf(q.toUpperCase());
      const t = k >= 0 && q ? esc(v.slice(0, k)) + '<b>' + esc(v.slice(k, k + q.length)) + '</b>' + esc(v.slice(k + q.length)) : esc(v);
      return `<div data-i="${i}" class="${i === act ? 'act' : ''}">${t}</div>`;
    }).join('');
    caja.hidden = !items.length;
    const a = caja.children[act]; if (a) a.scrollIntoView({ block: 'nearest' });
  };
  const busca = () => {
    const q = input.value.trim().toUpperCase();
    if (!q) { items = []; return pinta(); }
    const empieza = valores.filter((v) => v.toUpperCase().startsWith(q));
    const contiene = valores.filter((v) => !v.toUpperCase().startsWith(q) && v.toUpperCase().includes(q));
    items = [...empieza, ...contiene].filter((v) => v.toUpperCase() !== q).slice(0, 8); act = 0; pinta();
  };
  const elige = (i) => { if (items[i] == null) return; input.value = items[i]; items = []; pinta(); input.dispatchEvent(new Event('change')); };
  input.addEventListener('input', busca);
  input.addEventListener('focus', () => { if (input.value.trim()) busca(); });
  input.addEventListener('blur', () => setTimeout(() => { items = []; pinta(); }, 120));
  input.addEventListener('keydown', (e) => {
    if (caja.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); act = (act + 1) % items.length; pinta(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); act = (act - 1 + items.length) % items.length; pinta(); }
    else if (e.key === 'Enter') { e.preventDefault(); elige(act); }
    else if (e.key === 'Escape') { items = []; pinta(); }
  });
  caja.addEventListener('mousedown', (e) => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); elige(+d.dataset.i); } });
}

// ENTER no hace nada en el formulario; solo se guarda con clic en el botón (en NOTAS sí hace salto de línea)
$('f').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
});
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('guardar'), msg = $('msg');
  const datos = {};
  for (const k of CAMPOS) datos[k] = $(k).value.trim().toUpperCase();
  datos.fecha = $('fecha').value;
  datos.tipo = $('inbond').checked ? 'IN-BOND' : '';
  datos.hazmat = $('hazmat').checked ? 'HAZ-MAT' : '';
  datos.notas = $('notas').value.trim();
  if (datos.descripcion === '__OTRO') datos.descripcion = $('descOtro').value.trim().toUpperCase();
  datos.referencia = $('referencia').value.trim();
  datos.referencia = datos.referencia.toUpperCase();
  if (!/^\d{1,4}\/\d{2}[A-Z0-9]?$/.test(datos.referencia)) {
    msg.className = 'msg err'; msg.textContent = 'Escribe la referencia con el formato ####/### (por ejemplo 1628/26 o 1628/26A).';
    $('referencia').focus(); return;
  }
  btn.disabled = true; btn.textContent = 'Guardando…'; msg.className = 'msg';
  try {
    const r = await fetch('/api/admin/entradas-bodega', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'Error');
    if (datos.hazmat && datos.pedimento) await avisoHazmat(j.referencia);
    $('f').reset(); $('descOtro').hidden = true; $('fecha').value = hoy();
    msg.className = 'msg ok';
    msg.innerHTML = `Registro <b>${esc(j.referencia)}</b> guardado. <a href="/entradas-bodega">Ver en el tablero</a>`;
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = 'No se pudo guardar: ' + err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar registro';
  }
};

// Recordatorio cuando un tráfico HAZMAT recibe su pedimento
function avisoHazmat(referencia) {
  return new Promise((ok) => {
    const f = document.createElement('div');
    f.className = 'aviso-fondo';
    f.innerHTML = `<div class="aviso-caja" role="alertdialog" aria-modal="true"><p class="tit">⚠ HAZ-MAT</p><p class="ref">${esc(referencia)}</p>
      <p class="txt">RECUERDA QUITAR EL REGISTRO DE HAZMAT EN LA PAGINA OFICIAL</p><button type="button">Entendido</button></div>`;
    document.body.appendChild(f);
    const b = f.querySelector('button'); b.focus();
    b.onclick = () => { f.remove(); ok(); };
  });
}

$('fecha').value = hoy();
</script>
<script src="/solo-lectura.js"></script>
</body>
</html>
