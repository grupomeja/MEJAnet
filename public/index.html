<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEJAnet</title>
<style>
  :root{--bg:#f4f8fb;--ink:#0b1a33;--accent:#1f4e8c;--accent-ink:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:520px;padding:32px 20px;text-align:center}
  img{width:min(300px,70%);height:auto;display:block;margin:0 auto 6px}
  h1{margin:0 0 36px;font-size:clamp(34px,9vw,52px);letter-spacing:1px;font-weight:800}
  h1 span{color:#4fc9ee}
  a.boton{display:block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:20px;padding:18px 20px;border-radius:14px;box-shadow:0 6px 18px rgba(31,78,140,.25);transition:transform .08s,filter .15s}
  a.boton:hover{filter:brightness(1.1)}
  a.boton:active{transform:scale(.98)}
</style>
</head>
<body>
<main>
  <img src="/mejanet-logo.png" alt="Grupo Meja">
  <h1>MEJA<span>net</span></h1>
  <a class="boton" href="/orden-de-carga">Orden de Carga</a>
</main>
</body>
</html>
